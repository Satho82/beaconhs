name: Add Platform Dashboard Catalog Key

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const branch = 'feature/uvanoo-v1.3-platform-foundation'
            const files = [
              'packages/i18n/src/messages/en.json',
              'packages/i18n/src/messages/es.json',
              'packages/i18n/src/messages/fr.json',
            ]
            const translations = ['Dashboard', 'Panel', 'Tableau de bord']
            function systemMessageKey(source) {
              let high = 0xdeadbeef
              let low = 0x41c6ce57
              for (let index = 0; index < source.length; index += 1) {
                const code = source.charCodeAt(index)
                high = Math.imul(high ^ code, 2654435761)
                low = Math.imul(low ^ code, 1597334677)
              }
              high = Math.imul(high ^ (high >>> 16), 2246822507)
              high ^= Math.imul(low ^ (low >>> 13), 3266489909)
              low = Math.imul(low ^ (low >>> 16), 2246822507)
              low ^= Math.imul(high ^ (high >>> 13), 3266489909)
              const value = 4294967296 * (2097151 & low) + (high >>> 0)
              return 'm_' + value.toString(16).padStart(14, '0')
            }
            const { owner, repo } = context.repo
            const reference = await github.rest.git.getRef({ owner, repo, ref: 'heads/' + branch })
            const parentSha = reference.data.object.sha
            const parent = await github.rest.git.getCommit({ owner, repo, commit_sha: parentSha })
            const parentTree = await github.rest.git.getTree({ owner, repo, tree_sha: parent.data.tree.sha, recursive: 'true' })
            const tree = []
            for (let locale = 0; locale < files.length; locale += 1) {
              const entry = parentTree.data.tree.find((candidate) => candidate.path === files[locale])
              if (!entry?.sha) throw new Error('Missing catalog: ' + files[locale])
              const result = await github.rest.git.getBlob({ owner, repo, file_sha: entry.sha })
              const document = JSON.parse(Buffer.from(result.data.content, 'base64').toString('utf8'))
              document.Generated[systemMessageKey('Dashboard')] = translations[locale]
              const blob = await github.rest.git.createBlob({ owner, repo, content: JSON.stringify(document, null, 2) + '\n', encoding: 'utf-8' })
              tree.push({ path: files[locale], mode: '100644', type: 'blob', sha: blob.data.sha })
            }
            tree.push({ path: '.github/workflows/add-platform-dashboard-catalog.yml', mode: '100644', type: 'blob', sha: null })
            const nextTree = await github.rest.git.createTree({ owner, repo, base_tree: parent.data.tree.sha, tree })
            const commit = await github.rest.git.createCommit({ owner, repo, message: 'fix(i18n): add platform dashboard catalog key', tree: nextTree.data.sha, parents: [parentSha] })
            await github.rest.git.updateRef({ owner, repo, ref: 'heads/' + branch, sha: commit.data.sha, force: false })
