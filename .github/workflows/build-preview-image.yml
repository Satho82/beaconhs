name: Build preview image

on:
  push:
    branches:
      - feature/uvanoo-v1.4
  pull_request:
    branches:
      - feature/uvanoo-v1.4
    paths:
      - 'apps/web/src/app/(app)/hospitality/**'
      - 'apps/web/src/app/(app)/inspections/**'
      - 'apps/web/src/app/(app)/equipment/**'
      - 'apps/web/src/app/platform-branding/**'
      - 'apps/web/src/components/app-sidebar.tsx'
      - 'apps/web/src/components/brand-logo.tsx'
      - 'apps/web/src/lib/hospitality/**'
      - 'apps/web/src/lib/platform-brand*.ts'
      - '.github/workflows/build-preview-image.yml'
  workflow_dispatch:
    inputs:
      preview_slug:
        description: "Lowercase preview identifier, e.g. metering"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: preview-image-${{ inputs.preview_slug || 'metering' }}
  cancel-in-progress: false

jobs:
  validate-and-build:
    name: Validate and publish immutable preview image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      IMAGE_NAME: ghcr.io/satho82/uvanoo-preview
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Enable pinned pnpm
        run: |
          npm install -g corepack@0.35.0
          corepack enable
          corepack prepare pnpm@10.30.3 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck web
        run: pnpm --filter web typecheck

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image metadata
        id: meta
        run: |
          preview_slug="${{ inputs.preview_slug || 'metering' }}"
          case "$preview_slug" in
            *[!a-z0-9-]*|'') echo "preview_slug must be lowercase alphanumeric or hyphen" >&2; exit 1 ;;
          esac
          echo "tag=preview-$preview_slug-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          build-args: |
            DEPLOYMENT_VERSION=${{ github.sha }}
            BUILD_NODE_HEAP_MB=8192

      - name: Publish handoff
        run: |
          {
            echo "## Preview image"
            echo ""
            echo "Commit: \`${GITHUB_SHA}\`"
            echo "Image: \`${IMAGE_NAME}@${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "This job never deploys. The isolated Preview Platform admission"
            echo "must verify image digest, preview-only network, cloned preview data,"
            echo "HTTPS host, and browser screenshots before owner review."
          } >> "$GITHUB_STEP_SUMMARY"
