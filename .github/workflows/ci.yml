name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  deployment-eligibility:
    name: Classify main push for deployment eligibility
    # A manual run has no trustworthy before..after range. It must therefore
    # fail closed rather than turn CI into a deployment entrypoint.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      has_application_changes: ${{ steps.classify.outputs.has_application_changes }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          # The range classifier needs the complete commit graph. A shallow
          # clone cannot reliably prove that `before` is an ancestor of `after`.
          fetch-depth: 0
      - id: classify
        name: Fail closed unless the pushed range changes application content
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! [[ "$BEFORE" =~ ^[0-9a-f]{40}$ && "$AFTER" =~ ^[0-9a-f]{40}$ ]] \
            || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            echo 'has_application_changes=false' >> "$GITHUB_OUTPUT"
            echo 'Deployment skipped: no trustworthy push range.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! git cat-file -e "${BEFORE}^{commit}" \
            || ! git cat-file -e "${AFTER}^{commit}" \
            || ! git merge-base --is-ancestor "$BEFORE" "$AFTER"; then
            echo 'has_application_changes=false' >> "$GITHUB_OUTPUT"
            echo 'Deployment skipped: push range is not a fast-forward history.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if git diff --name-only --diff-filter=ACDMRT "$BEFORE" "$AFTER" | grep -qv '^\.github/'; then
            echo 'has_application_changes=true' >> "$GITHUB_OUTPUT"
            echo 'Deployment eligible: application content changed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'has_application_changes=false' >> "$GITHUB_OUTPUT"
            echo 'Deployment skipped: workflow/configuration-only push.' >> "$GITHUB_STEP_SUMMARY"
          fi

  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beaconhs_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://beaconhs_app:beaconhs_app@localhost:5432/beaconhs_test
      MIGRATION_DATABASE_URL: postgresql://beaconhs_migrator:beaconhs_migrator@localhost:5432/beaconhs_test
      SUPERADMIN_DATABASE_URL: postgresql://beaconhs_super:beaconhs_super@localhost:5432/beaconhs_test
      DATABASE_OWNER_ROLE: beaconhs_owner
      DATABASE_BACKUP_ROLE: beaconhs_backup
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-secret-not-used-in-prod
      ATTACHMENT_CAPABILITY_SECRET: ci-attachment-capability-secret-32-chars
      BETTER_AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      # No version here — package.json's packageManager field pins pnpm; passing
      # both errors "Multiple versions of pnpm specified". Node 24 matches the
      # deploy image and package engines.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Provision isolated owner, migration, and RLS roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE beaconhs_owner NOLOGIN NOSUPERUSER NOBYPASSRLS;
          CREATE ROLE beaconhs_migrator LOGIN NOINHERIT NOSUPERUSER NOBYPASSRLS PASSWORD 'beaconhs_migrator';
          CREATE ROLE beaconhs_app LOGIN NOINHERIT NOSUPERUSER NOBYPASSRLS PASSWORD 'beaconhs_app';
          CREATE ROLE beaconhs_super LOGIN NOINHERIT NOSUPERUSER BYPASSRLS PASSWORD 'beaconhs_super';
          CREATE ROLE beaconhs_backup LOGIN NOINHERIT NOSUPERUSER BYPASSRLS PASSWORD 'beaconhs_backup';
          ALTER ROLE beaconhs_backup SET default_transaction_read_only = 'on';
          GRANT beaconhs_owner TO beaconhs_migrator;
          ALTER DATABASE beaconhs_test OWNER TO beaconhs_owner;
          REVOKE ALL ON DATABASE beaconhs_test FROM PUBLIC;
          GRANT CONNECT ON DATABASE beaconhs_test TO beaconhs_migrator, beaconhs_app, beaconhs_super, beaconhs_backup;
          \connect beaconhs_test
          ALTER SCHEMA public OWNER TO beaconhs_owner;
          REVOKE ALL ON SCHEMA public FROM PUBLIC;
          SQL
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm deadcode:check
      - name: Test deployment host safeguards
        run: |
          scripts/cluster/dokploy-curl.test.sh
          scripts/ci/require-current-main.test.sh
          scripts/ci/workflow-repository-immutability.test.sh
      - name: Apply the production migration path
        run: pnpm --filter @beaconhs/db exec tsx src/migrate.ts
      - name: Prove migrations are idempotent
        run: pnpm --filter @beaconhs/db exec tsx src/migrate.ts
      - run: pnpm test
      # Next.js production build exceeded the runner's default ~4 GB V8 heap.
      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  deploy-dev:
    name: Deploy tested commit to dev
    if: >-
      github.event_name == 'push' &&
      needs.deployment-eligibility.result == 'success' &&
      needs.deployment-eligibility.outputs.has_application_changes == 'true'
    needs: [ci, deployment-eligibility]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-dev.yml
    with:
      ci_gate_completed: true
    secrets: inherit
