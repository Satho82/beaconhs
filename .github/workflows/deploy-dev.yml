name: Deploy (dev)

# Standard dev deployment, called by the CI workflow after its gate job passes
# for the same main-branch commit: build and push the commit's image, run the
# forward-only database migrations, point the Dokploy compose at the new image
# digest, redeploy, and wait for exact-SHA readiness. Images are built on
# GitHub-hosted runners; migration and deployment run on the Dokploy runner.
# All deployment-specific values live in repository secrets.

on:
  workflow_call:
    inputs:
      ci_gate_completed:
        description: Set only by the CI caller after its gate job succeeds
        required: false
        type: boolean
        default: false
      source_sha:
        description: Verified immutable source SHA for an approved feature candidate
        required: false
        type: string
        default: ''
      image_digest:
        description: Verified immutable image digest for an approved feature candidate
        required: false
        type: string
        default: ''
      feature_candidate_verified:
        description: Set only by the V1.4 candidate verification workflow
        required: false
        type: boolean
        default: false
    secrets:
      MAIN_MIGRATION_DATABASE_URL:
        description: Canonical normal-main migrator connection on infra-net
        required: true
      MAIN_DATABASE_URL:
        description: Canonical normal-main runtime connection on infra-net
        required: true
      MAIN_SUPERADMIN_DATABASE_URL:
        description: Canonical normal-main maintenance connection on infra-net
        required: true
      DEV_MIGRATION_DATABASE_URL:
        description: Verified V1.4 candidate migrator connection on the DEV-private network
        required: true
      DEV_DATABASE_URL:
        description: Verified V1.4 candidate runtime connection on the DEV-private network
        required: true
      DEV_SUPERADMIN_DATABASE_URL:
        description: Verified V1.4 candidate maintenance connection on the DEV-private network
        required: true
      # The remaining deployment secrets are inherited by the caller as needed.
      DEV_APP_URL:
        required: false
      DEV_ATTACHMENT_CAPABILITY_SECRET:
        required: false
      DEV_BETTER_AUTH_SECRET:
        required: false
      DEV_REDIS_URL:
        required: false
      MAIN_REDIS_URL:
        required: false
      DOKPLOY_COMPOSE_ID:
        required: false
      DOKPLOY_RESOLVE_IP:
        required: false
      DOKPLOY_TOKEN:
        required: false
      DOKPLOY_URL:
        required: false
      R2_ACCESS_KEY_ID:
        required: false
      R2_BUCKET:
        required: false
      R2_ENDPOINT:
        required: false
      R2_PRIVATE_BUCKET_CONFIRMED:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false
      SENTRY_DSN:
        required: false
      VAPID_PRIVATE_KEY:
        required: false
      VAPID_PUBLIC_KEY:
        required: false
      VAPID_SUBJECT:
        required: false

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  IMAGE_NAME: ghcr.io/satho82/beaconhs
  COLLABORA_IMAGE: collabora/code:26.04.2.1.1@sha256:df33af88c59e26b7335ea98d91e65f1edf13f33369ce6115941b8d59d3409cb5
  # The migration runtime is pinned separately from the application image so
  # it can be verified before the forward-only migration command is reached.
  MIGRATION_NODE_IMAGE: node:24-bookworm@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4
  DEPLOY_UTILITY_IMAGE: alpine:3@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b

jobs:
  build:
    if: inputs.source_sha == ''
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      image_digest: ${{ steps.build-image.outputs.digest }}
    steps:
      - name: Require the gated main-branch CI caller
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          CI_GATE_COMPLETED: ${{ inputs.ci_gate_completed }}
        run: |
          set -euo pipefail
          if [ "$REF" != refs/heads/main ] || [ "$CI_GATE_COMPLETED" != true ] \
            || { [ "$EVENT_NAME" != push ] && [ "$EVENT_NAME" != workflow_dispatch ]; }; then
            echo "::error::Dev deployment must be called by the main-branch CI workflow after its gate job succeeds"
            exit 1
          fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Reject stale main-branch workflow runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/ci/require-current-main.sh
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            DEPLOYMENT_VERSION=${{ github.sha }}
          # Next generates a fresh Server Actions encryption key for this image.
          # Every replica of the release must use the same immutable digest.
          # ignore-error: the GHA cache backend intermittently fails the blob
          # write ("error writing layer blob: not_found") AFTER the image is
          # already pushed — don't let a cache hiccup fail the build/deploy.
          cache-to: type=gha,mode=max,ignore-error=true

  deploy:
    needs: [build]
    # Main deployments require the existing build. A V1.4 deployment can only
    # use the two immutable values emitted by the dedicated verifier workflow.
    if: >-
      always() && (
        (inputs.source_sha == '' && needs.build.result == 'success') ||
        (inputs.source_sha != '' && inputs.image_digest != '' &&
          inputs.feature_candidate_verified)
      )
    permissions:
      contents: read
      packages: read
    runs-on: [self-hosted, dokploy]
    timeout-minutes: 45
    env:
      IMAGE_DIGEST: ${{ inputs.image_digest || needs.build.outputs.image_digest }}
      DEPLOY_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      DEPLOY_IMAGE_NAME: ${{ inputs.source_sha != '' && 'ghcr.io/satho82/uvanoo-staging-private' || 'ghcr.io/satho82/beaconhs' }}
      CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
      DEPLOY_GOVERNANCE_SHA: ${{ github.workflow_sha }}
      # The candidate database is isolated from the normal main deployment
      # stack. Keep the main path on infra-net and use the DEV-private alias
      # only after the candidate verifier has approved the immutable input.
      MIGRATION_DOCKER_NETWORK: ${{ inputs.feature_candidate_verified && 'uvanoo-dev-private' || 'infra-net' }}
      RUNTIME_DOCKER_NETWORK: ${{ inputs.feature_candidate_verified && 'uvanoo-dev-runtime' || 'infra-net' }}
      DOKPLOY_COMPOSE_ID: ${{ inputs.feature_candidate_verified && 'wYb0LxLQrvj2FPI21i-Oj' || secrets.DOKPLOY_COMPOSE_ID }}
      EXPECTED_DOKPLOY_STACK: ${{ inputs.feature_candidate_verified && 'uvanoo-v1-4-dev-gniriv' || 'beaconhs-ib9ybf' }}
      EXPECTED_APP_HOST: ${{ inputs.feature_candidate_verified && 'dev.uvanoo.com' || 'portal.uvanoo.com' }}
      MIGRATION_DATABASE_URL: ${{ inputs.feature_candidate_verified && secrets.DEV_MIGRATION_DATABASE_URL || secrets.MAIN_MIGRATION_DATABASE_URL }}
      DATABASE_URL: ${{ inputs.feature_candidate_verified && secrets.DEV_DATABASE_URL || secrets.MAIN_DATABASE_URL }}
      SUPERADMIN_DATABASE_URL: ${{ inputs.feature_candidate_verified && secrets.DEV_SUPERADMIN_DATABASE_URL || secrets.MAIN_SUPERADMIN_DATABASE_URL }}
      REDIS_URL: ${{ inputs.feature_candidate_verified && secrets.DEV_REDIS_URL || secrets.MAIN_REDIS_URL }}
      EXPECTED_MIGRATION_HOST: ${{ inputs.feature_candidate_verified && 'uvanoo-dev-postgres' || 'beaconhs-postgres' }}
    steps:
      # The deploy runner shares storage with Dokploy. Keep stale build cache
      # and superseded images from exhausting the host and taking the Dokploy
      # API offline. Active service images and all volumes are preserved.
      - name: Reclaim stale deployment-runner storage
        run: |
          set -euo pipefail
          echo "Storage before cleanup:"
          df -h /
          docker system df
          docker builder prune --force --filter until=168h
          docker image prune --all --force --filter until=168h
          echo "Storage after cleanup:"
          df -h /
          available_kb="$(df -Pk / | awk 'NR==2 {print $4}')"
          if ! [[ "$available_kb" =~ ^[0-9]+$ ]] || [ "$available_kb" -lt 2097152 ]; then
            echo "::error::The Dokploy runner requires at least 2 GiB free after safe Docker cleanup"
            exit 1
          fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.DEPLOY_SOURCE_SHA }}
          persist-credentials: false
      # Relative reusable calls resolve at the caller workflow commit. Pin the
      # compose separately so the frozen application checkout cannot select it.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.DEPLOY_GOVERNANCE_SHA }}
          path: .deployment-governance
          persist-credentials: false
      - name: Verify deployment governance source
        env:
          FEATURE_CANDIDATE_VERIFIED: ${{ inputs.feature_candidate_verified }}
        run: |
          set -euo pipefail
          if ! [[ "$DEPLOY_GOVERNANCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Deployment governance must have a full immutable workflow SHA'
            exit 1
          fi
          test "$(git -C .deployment-governance rev-parse HEAD)" = "$DEPLOY_GOVERNANCE_SHA"
          if [ "$FEATURE_CANDIDATE_VERIFIED" = true ]; then
            caller_path=.github/workflows/deploy-v1.4-dev-candidate.yml
          else
            caller_path=.github/workflows/ci.yml
            test "$DEPLOY_GOVERNANCE_SHA" = "$DEPLOY_SOURCE_SHA"
          fi
          test "$CALLER_WORKFLOW_REF" = "$GITHUB_REPOSITORY/$caller_path@$GITHUB_REF"
          grep -Fx '    uses: ./.github/workflows/deploy-dev.yml' ".deployment-governance/$caller_path" >/dev/null
          compose_blob="$(git -C .deployment-governance rev-parse "$DEPLOY_GOVERNANCE_SHA:deploy/dokploy-dev.compose.yaml")"
          test "$(git hash-object .deployment-governance/deploy/dokploy-dev.compose.yaml)" = "$compose_blob"
          printf 'Deployment governance SHA: %s\nCompose blob: %s\n' "$DEPLOY_GOVERNANCE_SHA" "$compose_blob" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate verified deployment identity
        run: |
          set -euo pipefail
          if ! [[ "$DEPLOY_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Deployment source must be a full lowercase commit SHA"
            exit 1
          fi
          if [ "${{ inputs.source_sha }}" != '' ] \
            && { [ "${{ inputs.feature_candidate_verified }}" != true ] \
              || [ "${{ inputs.image_digest }}" = '' ]; }; then
            echo "::error::Feature deployments require the verified candidate workflow"
            exit 1
          fi
          if [ "${{ inputs.source_sha }}" != '' ] \
            && [[ "$CALLER_WORKFLOW_REF" != "$GITHUB_REPOSITORY/.github/workflows/deploy-v1.4-dev-candidate.yml@"* ]]; then
            echo "::error::Feature deployments may only be called by the V1.4 candidate verifier workflow"
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$DEPLOY_SOURCE_SHA"
      - name: Validate immutable build output
        run: |
          set -euo pipefail
          if ! [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The image build did not return a canonical sha256 digest"
            exit 1
          fi
          echo "Deploying immutable image ${DEPLOY_IMAGE_NAME}@${IMAGE_DIGEST} from $DEPLOY_SOURCE_SHA"

      - name: Configure TLS-preserving Dokploy split-DNS resolution
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_RESOLVE_IP: ${{ secrets.DOKPLOY_RESOLVE_IP }}
        run: |
          set -euo pipefail
          dokploy_host="${DOKPLOY_URL#https://}"
          if [ "$dokploy_host" = "$DOKPLOY_URL" ] \
            || [ "${#dokploy_host}" -gt 253 ] \
            || ! [[ "$dokploy_host" =~ ^([A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?$ ]]; then
            echo "::error::DOKPLOY_URL must be an HTTPS origin with a DNS hostname, no port, path, query, fragment, or trailing slash"
            exit 1
          fi
          if ! [[ "$DOKPLOY_RESOLVE_IP" =~ ^(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ ]]; then
            echo "::error::DOKPLOY_RESOLVE_IP must be a canonical private IPv4 address"
            exit 1
          fi
          IFS=. read -r ip_a ip_b ip_c ip_d <<< "$DOKPLOY_RESOLVE_IP"
          for octet in "$ip_a" "$ip_b" "$ip_c" "$ip_d"; do
            if [ "$((10#$octet))" -gt 255 ]; then
              echo "::error::DOKPLOY_RESOLVE_IP must be a canonical private IPv4 address"
              exit 1
            fi
          done
          if ! (( ip_a == 10 \
            || (ip_a == 172 && ip_b >= 16 && ip_b <= 31) \
            || (ip_a == 192 && ip_b == 168) )); then
            echo "::error::DOKPLOY_RESOLVE_IP must be an RFC 1918 private IPv4 address"
            exit 1
          fi
          printf 'DOKPLOY_CURL_RESOLVE=%s\n' \
            "${dokploy_host}:443:${DOKPLOY_RESOLVE_IP}" >> "$GITHUB_ENV"

      # Dokploy remains the preferred control plane. If its API credential is
      # unavailable, identify the one existing BeaconHS stack from the Swarm
      # service specs and perform an image-only rollout later. That fallback
      # preserves Dokploy's routing labels and every existing service setting.
      - name: Resolve the dev deployment target
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          COMPOSE_ID: ${{ env.DOKPLOY_COMPOSE_ID }}
          EXPECTED_STACK: ${{ env.EXPECTED_DOKPLOY_STACK }}
          EXPECTED_APP_HOST: ${{ env.EXPECTED_APP_HOST }}
          FEATURE_CANDIDATE_VERIFIED: ${{ inputs.feature_candidate_verified }}
        run: |
          set -euo pipefail
          umask 077
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          http_status="$(scripts/cluster/dokploy-curl.sh -sS --connect-timeout 5 --max-time 20 \
            --retry 2 --retry-delay 2 --retry-max-time 30 \
            --noproxy "${DOKPLOY_CURL_RESOLVE%%:*}" \
            --resolve "$DOKPLOY_CURL_RESOLVE" -G -o "$response" -w '%{http_code}' \
            "${DOKPLOY_URL%/}/api/compose.one" \
            --data-urlencode "composeId=$COMPOSE_ID")" || http_status=000

          if [ "$http_status" = 200 ]; then
            if ! jq -e --arg id "$COMPOSE_ID" \
                '.composeId == $id and .serverId == null' "$response" >/dev/null; then
              echo "::error::Dokploy compose.one did not return the configured local compose target"
              exit 1
            fi
            target_stack="$(jq -er '.appName | select(type=="string" and length>0)' "$response")"
            if [ "$target_stack" != "$EXPECTED_STACK" ]; then
              echo "::error::Dokploy compose target does not match the selected deployment stack"
              exit 1
            fi
            if [ "$FEATURE_CANDIDATE_VERIFIED" = true ]; then
              if ! jq -e --arg id "$COMPOSE_ID" --arg host "$EXPECTED_APP_HOST" '
                .composeId == "wYb0LxLQrvj2FPI21i-Oj" and
                .appName == "uvanoo-v1-4-dev-gniriv" and
                .environmentId == "qT391QtcIqahNap5wPjif" and
                $host == "dev.uvanoo.com" and
                (.domains | type == "array" and length == 1) and
                (.domains[0] | .composeId == $id and .host == $host and
                  .serviceName == "web" and .port == 3000 and
                  .path == "/" and .https == true and .enabled == true)
              ' "$response" >/dev/null; then
                echo "::error::Canonical candidate DEV target must route only dev.uvanoo.com to web:3000 over HTTPS"
                exit 1
              fi
            fi
            existing_registry_id_json="$(jq -c '
              if (has("registryId") | not) or .registryId == null then null
              elif (.registryId | type) == "string" and (.registryId | length) > 0 then
                .registryId
              else
                error("invalid registryId")
              end
            ' "$response")" \
              || { echo "::error::Dokploy compose target returned an invalid registry identity"; exit 1; }
            deploy_mode=api
          elif [[ "$http_status" =~ ^(000|401|403|500|502|503|504)$ ]]; then
            if [ "$FEATURE_CANDIDATE_VERIFIED" = true ]; then
              echo "::error::Verified candidates require the canonical Dokploy DEV target; direct fallback is forbidden"
              exit 1
            fi
            mapfile -t stacks < <(
              docker service ls --format '{{.Name}} {{.Image}}' \
                | awk '$2 ~ /^ghcr\.io\/braedonsaunders\/beaconhs(@|:)/ && $1 ~ /_web$/ {sub(/_web$/, "", $1); print $1}'
            )
            if [ "${#stacks[@]}" -ne 1 ]; then
              echo "::error::Direct deployment requires exactly one existing BeaconHS Swarm stack"
              exit 1
            fi
            target_stack="${stacks[0]}"
            for role in web worker scheduler storage-init; do
              service="${target_stack}_${role}"
              image="$(docker service inspect "$service" \
                --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')"
              if [[ ! "$image" =~ ^ghcr\.io/braedonsaunders/beaconhs(@|:) ]]; then
                echo "::error::Direct deployment target $service is not a BeaconHS service"
                exit 1
              fi
            done
            existing_registry_id_json=null
            deploy_mode=direct
            echo "::warning::Dokploy API returned HTTP $http_status; using the validated image-only Swarm rollout"
          else
            echo "::error::Dokploy compose.one returned unexpected HTTP $http_status"
            exit 1
          fi

          if [[ ! "$target_stack" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Deployment target returned an invalid Swarm stack name"
            exit 1
          fi
          {
            printf 'DOKPLOY_TARGET_STACK=%s\n' "$target_stack"
            printf 'DOKPLOY_EXISTING_REGISTRY_ID_JSON=%s\n' "$existing_registry_id_json"
            printf 'DOKPLOY_DEPLOY_MODE=%s\n' "$deploy_mode"
          } >> "$GITHUB_ENV"

          if [ "$deploy_mode" = api ]; then
            previous_image="$(awk -F= '$1 == "IMAGE" {sub(/^[^=]*=/, ""); print; exit}' "$response")"
            previous_source_sha="$(awk -F= '$1 == "APP_VERSION" {sub(/^[^=]*=/, ""); print; exit}' "$response")"
          else
            previous_image="$(docker service inspect "${target_stack}_web" --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')"
            previous_source_sha="$(docker service inspect "${target_stack}_web" --format '{{range .Spec.TaskTemplate.ContainerSpec.Env}}{{println .}}{{end}}' | awk -F= '$1 == "APP_VERSION" {print $2; exit}')"
          fi
          {
            echo "Previous DEV source SHA: ${previous_source_sha:-not recorded}"
            echo "Previous DEV image digest: ${previous_image#*@}"
          } >> "$GITHUB_STEP_SUMMARY"

      # Prove this run's least-privilege package token can read the exact
      # private image before touching anything. The token stays in a temporary
      # Docker config and is never persisted over Dokploy's registry login.
      - name: Pre-pull images onto the swarm manager
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! command -v docker >/dev/null 2>&1; then
            echo "::error::docker CLI not present on runner (socket mount expected)"
            exit 1
          fi
          IMAGE="${DEPLOY_IMAGE_NAME}@${IMAGE_DIGEST}"
          DOCKER_CONFIG="$(mktemp -d)"
          chmod 0700 "$DOCKER_CONFIG"
          export DOCKER_CONFIG
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" --format 'pulled {{.Id}}'
          docker pull "$COLLABORA_IMAGE"
          docker image inspect "$COLLABORA_IMAGE" --format 'pulled Collabora {{.Id}}'
          docker pull "$MIGRATION_NODE_IMAGE"
          docker image inspect "$MIGRATION_NODE_IMAGE" --format 'pulled migration runtime {{.Id}}'
          docker pull "$DEPLOY_UTILITY_IMAGE"
          docker image inspect "$DEPLOY_UTILITY_IMAGE" --format 'pulled deployment utility {{.Id}}'

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with: { node-version: 24.18.0 }
      # Install Node first: the self-hosted runner's system Node is not a
      # supported application runtime, and pnpm's installer invokes npm.
      # package.json's packageManager field pins pnpm; passing a version here
      # too errors with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - run: pnpm install --frozen-lockfile

      # The migration container deliberately uses the exact pnpm provisioned
      # by the pinned setup action. Do not invoke Corepack in the container:
      # that would fetch pnpm from the public registry after the deployment
      # has reached its forward-only migration phase.
      - name: Verify deterministic migration toolchain
        run: |
          set -euo pipefail
          if [ "$(pnpm --version)" != '10.30.3' ]; then
            echo '::error::The deployment runner did not provision pnpm 10.30.3'
            exit 1
          fi
          if [ -z "${PNPM_HOME:-}" ]; then
            echo '::error::pnpm/action-setup did not expose PNPM_HOME'
            exit 1
          fi
          toolchain_root="$(cd "$PNPM_HOME/../.." && pwd -P)"
          test -x "$toolchain_root/node_modules/.bin/pnpm"
          echo "MIGRATION_PNPM_TOOLCHAIN_ROOT=$toolchain_root" >> "$GITHUB_ENV"
          docker run --rm --pull=never \
            -v "$toolchain_root:/pnpm-toolchain:ro" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -w /workspace \
            -e PATH=/pnpm-toolchain/node_modules/.bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            "$MIGRATION_NODE_IMAGE" \
            pnpm --version | grep -Fx '10.30.3'
          docker run --rm --pull=never \
            -v "$toolchain_root:/pnpm-toolchain:ro" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -w /workspace \
            -e PATH=/pnpm-toolchain/node_modules/.bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            "$MIGRATION_NODE_IMAGE" \
            pnpm --filter @beaconhs/db exec tsx --version

      # Forward-only schema migrations run before the redeploy. The unpooled
      # migrator login can SET ROLE to the NOLOGIN owner; neither credential
      # reaches the long-running deployment containers.
      - name: Require complete selected database credential bundle
        env:
          FEATURE_CANDIDATE_VERIFIED: ${{ inputs.feature_candidate_verified }}
          DEV_MIGRATION_DATABASE_URL: ${{ secrets.DEV_MIGRATION_DATABASE_URL }}
          DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          DEV_SUPERADMIN_DATABASE_URL: ${{ secrets.DEV_SUPERADMIN_DATABASE_URL }}
          MAIN_MIGRATION_DATABASE_URL: ${{ secrets.MAIN_MIGRATION_DATABASE_URL }}
          MAIN_DATABASE_URL: ${{ secrets.MAIN_DATABASE_URL }}
          MAIN_SUPERADMIN_DATABASE_URL: ${{ secrets.MAIN_SUPERADMIN_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ "$FEATURE_CANDIDATE_VERIFIED" = true ]; then
            selected_bundle=(
              DEV_MIGRATION_DATABASE_URL
              DEV_DATABASE_URL
              DEV_SUPERADMIN_DATABASE_URL
            )
          else
            selected_bundle=(
              MAIN_MIGRATION_DATABASE_URL
              MAIN_DATABASE_URL
              MAIN_SUPERADMIN_DATABASE_URL
            )
          fi

          for credential_name in "${selected_bundle[@]}"; do
            if [ -z "${!credential_name}" ]; then
              echo "::error::Selected database credential bundle is incomplete"
              exit 1
            fi
          done

      - name: Validate migration database URLs
        env:
          MIGRATION_DATABASE_URL: ${{ env.MIGRATION_DATABASE_URL }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
          SUPERADMIN_DATABASE_URL: ${{ env.SUPERADMIN_DATABASE_URL }}
          EXPECTED_MIGRATION_HOST: ${{ env.EXPECTED_MIGRATION_HOST }}
        run: |
          node -e '
            const urls = [
              ["MIGRATION_DATABASE_URL", "beaconhs_migrator"],
              ["DATABASE_URL", "beaconhs_app"],
              ["SUPERADMIN_DATABASE_URL", "beaconhs_super"],
            ];
            for (const [name, role] of urls) {
              const u = new URL(process.env[name]);
              if (
                u.protocol !== "postgresql:" ||
                u.hostname !== process.env.EXPECTED_MIGRATION_HOST ||
                (u.port && u.port !== "5432") ||
                u.pathname !== "/beaconhs" ||
                decodeURIComponent(u.username) !== role ||
                !u.password
              ) {
                console.error(`::error::${name} does not match the selected deployment topology`);
                process.exit(1);
              }
            }
            console.log("Migration database URLs match the selected deployment topology");
          '

      - name: Validate selected Redis URL
        env:
          FEATURE_CANDIDATE_VERIFIED: ${{ inputs.feature_candidate_verified }}
          REDIS_URL: ${{ env.REDIS_URL }}
        run: |
          node -e '
            let url;
            try {
              url = new URL(process.env.REDIS_URL);
            } catch {
              console.error("::error::Selected Redis credential is missing or invalid");
              process.exit(1);
            }
            const candidate = process.env.FEATURE_CANDIDATE_VERIFIED === "true";
            const expectedHost = candidate ? "uvanoo-dev-redis" : "beaconhs-redis";
            if (url.protocol !== "redis:" || url.hostname !== expectedHost || (url.port && url.port !== "6379")) {
              console.error("::error::Selected Redis credential does not match the deployment topology");
              process.exit(1);
            }
            if (candidate && !url.password) {
              console.error("::error::Selected candidate Redis credential requires authentication");
              process.exit(1);
            }
            console.log("Selected Redis credential matches the deployment topology");
          '

      - name: Preflight all migration database roles
        env:
          NODE_ENV: production
          MIGRATION_DATABASE_URL: ${{ env.MIGRATION_DATABASE_URL }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
          SUPERADMIN_DATABASE_URL: ${{ env.SUPERADMIN_DATABASE_URL }}
        run: |
          docker run --rm --pull=never --network "$MIGRATION_DOCKER_NETWORK" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$MIGRATION_PNPM_TOOLCHAIN_ROOT:/pnpm-toolchain:ro" \
            -w /workspace \
            -e PATH=/pnpm-toolchain/node_modules/.bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -e NODE_ENV="$NODE_ENV" \
            -e MIGRATION_DATABASE_URL="$MIGRATION_DATABASE_URL" \
            -e DATABASE_URL="$DATABASE_URL" \
            -e SUPERADMIN_DATABASE_URL="$SUPERADMIN_DATABASE_URL" \
            "$MIGRATION_NODE_IMAGE" \
            pnpm --filter @beaconhs/db exec tsx -e '
              import postgres from "postgres";
              (async () => {
                const connections = [
                  ["MIGRATION_DATABASE_URL", "beaconhs_migrator"],
                  ["DATABASE_URL", "beaconhs_app"],
                  ["SUPERADMIN_DATABASE_URL", "beaconhs_super"],
                ];
                for (const [name, expectedRole] of connections) {
                  for (let attempt = 1; attempt <= 3; attempt++) {
                    const client = postgres(process.env[name], { connect_timeout: 5, max: 1 });
                    try {
                      const [identity] = await client`SELECT current_user, current_database()`;
                      if (identity.current_user !== expectedRole || identity.current_database !== "beaconhs") {
                        throw new Error(`${name} identity did not match ${expectedRole}|beaconhs`);
                      }
                      console.log(`${name} identity verified as ${expectedRole}|beaconhs`);
                      break;
                    } catch (error) {
                      if (error && typeof error === "object" && error.code === "EAI_AGAIN" && attempt < 3) {
                        console.log(`${name} DNS not ready; retrying (${attempt}/3)`);
                        await new Promise((resolve) => setTimeout(resolve, 1000));
                        continue;
                      }
                      throw error;
                    } finally {
                      await client.end({ timeout: 1 }).catch(() => undefined);
                    }
                  }
                }
              })().catch((error) => {
                console.error(error);
                process.exit(1);
              });
            '

      - name: Preflight candidate runtime topology
        if: inputs.feature_candidate_verified
        env:
          REDIS_URL: ${{ env.REDIS_URL }}
        run: |
          set -euo pipefail
          if ! docker network inspect "$RUNTIME_DOCKER_NETWORK" | jq -e '
            length == 1 and .[0].Name == "uvanoo-dev-runtime" and
            .[0].Driver == "overlay" and .[0].Scope == "swarm" and
            .[0].Attachable == true and .[0].Internal == true
          ' >/dev/null; then
            echo '::error::Candidate runtime preflight failed [NETWORK_ATTRIBUTES]: topology mismatch'
            exit 1
          fi
          docker run --rm --pull=never --network "$RUNTIME_DOCKER_NETWORK" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$MIGRATION_PNPM_TOOLCHAIN_ROOT:/pnpm-toolchain:ro" \
            -w /workspace \
            -e PATH=/pnpm-toolchain/node_modules/.bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -e REDIS_URL \
            "$MIGRATION_NODE_IMAGE" \
            pnpm --filter @beaconhs/jobs exec node -e '
              const net = require("node:net");
              const networkCodes = new Set(["EAI_AGAIN", "ECONNREFUSED", "EHOSTUNREACH", "ENETUNREACH", "ENOTFOUND", "ETIMEDOUT"]);
              const safeCode = (error, fallback) => {
                const code = error && typeof error.code === "string" ? error.code : "";
                return /^[A-Z0-9_]+$/.test(code) ? code : fallback;
              };
              const fail = (stage, error, fallback) => {
                console.error(`::error::Candidate runtime preflight failed [${stage}]: ${safeCode(error, fallback)}`);
                process.exit(1);
              };
              (async () => {
                let Redis;
                try {
                  Redis = require("ioredis");
                } catch (error) {
                  fail("RUNTIME_DEPENDENCY", error, "IOREDIS_UNAVAILABLE");
                  return;
                }
                let url;
                try {
                  url = new URL(process.env.REDIS_URL);
                } catch (error) {
                  fail("REDIS_URL_TOPOLOGY", error, "INVALID_URL");
                  return;
                }
                if (url.protocol !== "redis:") {
                  fail("REDIS_URL_TOPOLOGY", null, "UNEXPECTED_PROTOCOL");
                  return;
                }
                if (url.hostname !== "uvanoo-dev-redis") {
                  fail("REDIS_URL_TOPOLOGY", null, "UNEXPECTED_HOSTNAME");
                  return;
                }
                if (url.port && url.port !== "6379") {
                  fail("REDIS_URL_TOPOLOGY", null, "UNEXPECTED_PORT");
                  return;
                }
                if (!url.password) {
                  fail("REDIS_URL_TOPOLOGY", null, "MISSING_PASSWORD");
                  return;
                }
                try {
                  await new Promise((resolve, reject) => {
                    const socket = net.createConnection({ host: "uvanoo-dev-postgres", port: 5432 });
                    socket.setTimeout(5000);
                    socket.once("connect", () => { socket.destroy(); resolve(); });
                    socket.once("error", reject);
                    socket.once("timeout", () => { socket.destroy(); reject(Object.assign(new Error("PostgreSQL runtime connection timed out"), { code: "ETIMEDOUT" })); });
                  });
                } catch (error) {
                  fail("POSTGRES_DNS_OR_TCP", error, "CONNECTION_FAILED");
                  return;
                }
                const client = new Redis(process.env.REDIS_URL, {
                  lazyConnect: true, connectTimeout: 5000, commandTimeout: 5000,
                  retryStrategy: () => null, maxRetriesPerRequest: 0,
                });
                client.on("error", () => {});
                try {
                  await client.connect();
                } catch (error) {
                  fail(networkCodes.has(error && error.code) ? "REDIS_DNS_OR_TCP" : "REDIS_AUTH_OR_PING", error, "CONNECTION_FAILED");
                  return;
                }
                try {
                  if (await client.ping() !== "PONG") {
                    fail("REDIS_AUTH_OR_PING", null, "PING_NOT_PONG");
                    return;
                  }
                  console.log("Candidate runtime PostgreSQL reachable; authenticated Redis PONG");
                } catch (error) {
                  fail(networkCodes.has(error && error.code) ? "REDIS_DNS_OR_TCP" : "REDIS_AUTH_OR_PING", error, "PING_FAILED");
                } finally {
                  client.disconnect();
                }
              })().catch((error) => {
                console.error(`::error::Candidate runtime preflight failed [RUNTIME_DEPENDENCY]: ${safeCode(error, "UNEXPECTED_FAILURE")}`);
                process.exit(1);
              });
            '

      - name: Run database migrations
        env:
          NODE_ENV: production
          MIGRATION_DATABASE_URL: ${{ env.MIGRATION_DATABASE_URL }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
          SUPERADMIN_DATABASE_URL: ${{ env.SUPERADMIN_DATABASE_URL }}
          DATABASE_OWNER_ROLE: beaconhs_owner
        run: |
          docker run --rm --pull=never --network "$MIGRATION_DOCKER_NETWORK" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$MIGRATION_PNPM_TOOLCHAIN_ROOT:/pnpm-toolchain:ro" \
            -w /workspace \
            -e PATH=/pnpm-toolchain/node_modules/.bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -e NODE_ENV="$NODE_ENV" \
            -e MIGRATION_DATABASE_URL="$MIGRATION_DATABASE_URL" \
            -e DATABASE_URL="$DATABASE_URL" \
            -e SUPERADMIN_DATABASE_URL="$SUPERADMIN_DATABASE_URL" \
            -e DATABASE_OWNER_ROLE="$DATABASE_OWNER_ROLE" \
            "$MIGRATION_NODE_IMAGE" \
            pnpm --filter @beaconhs/db exec tsx src/migrate.ts

      # coolwsd caches browser assets at startup, so a changed branding file
      # needs a Collabora restart; an unchanged file needs nothing.
      - name: Install Collabora branding on the swarm manager
        run: |
          set -euo pipefail
          before="$(docker run --rm --pull=never -v /etc/dokploy/beaconhs:/target "$DEPLOY_UTILITY_IMAGE" \
            sh -c 'sha256sum /target/collabora-branding.js 2>/dev/null | cut -d" " -f1' || true)"
          docker run --rm --pull=never -i -v /etc/dokploy/beaconhs:/target "$DEPLOY_UTILITY_IMAGE" \
            sh -c 'cat > /target/collabora-branding.js && chmod 0644 /target/collabora-branding.js' \
            < deploy/collabora-branding.js
          after="$(sha256sum deploy/collabora-branding.js | cut -d' ' -f1)"
          echo "branding installed ($(wc -c < deploy/collabora-branding.js) bytes)"
          if [ "$before" != "$after" ]; then
            service="${DOKPLOY_TARGET_STACK}_collabora"
            if docker service inspect "$service" >/dev/null 2>&1; then
              echo "branding changed — restarting the current Collabora service"
              docker service update --force "$service" >/dev/null
            else
              echo "No existing Collabora service found; the new deployment will load the branding"
            fi
          else
            echo "branding unchanged — no restart needed"
          fi

      - name: Update the Dokploy compose environment
        if: env.DOKPLOY_DEPLOY_MODE == 'api'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          COMPOSE_ID: ${{ env.DOKPLOY_COMPOSE_ID }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
          SUPERADMIN_DATABASE_URL: ${{ env.SUPERADMIN_DATABASE_URL }}
          REDIS_URL: ${{ env.REDIS_URL }}
          APP_URL: ${{ secrets.DEV_APP_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.DEV_BETTER_AUTH_SECRET }}
          ATTACHMENT_CAPABILITY_SECRET: ${{ secrets.DEV_ATTACHMENT_CAPABILITY_SECRET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PRIVATE_BUCKET_CONFIRMED: ${{ secrets.R2_PRIVATE_BUCKET_CONFIRMED }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set -euo pipefail
          umask 077
          update_response="$(mktemp)"
          compose_state="$(mktemp)"
          env_block_file="$(mktemp)"
          trap 'rm -f "$update_response" "$compose_state" "$env_block_file"' EXIT
          IMAGE="${DEPLOY_IMAGE_NAME}@${IMAGE_DIGEST}"
          COMPOSE_FILE="$(cat .deployment-governance/deploy/dokploy-dev.compose.yaml)"
          # Collabora is served same-origin on the app domain (Traefik path
          # routes), so both editor and WOPI-callback bases are APP_URL; the
          # server_name is the bare host for Collabora's generated URLs.
          APP_HOST="$(printf '%s' "$APP_URL" | sed -E 's~^https?://~~; s~/+$~~' | tr '[:upper:]' '[:lower:]')"
          {
            printf 'IMAGE=%s\n' "$IMAGE"
            printf 'APP_VERSION=%s\n' "$DEPLOY_SOURCE_SHA"
            printf 'WRITER_REPLICAS=1\n'
            printf 'COLLABORA_IMAGE=%s\n' "$COLLABORA_IMAGE"
            printf 'COLLABORA_URL=%s\n' "$APP_URL"
            printf 'COLLABORA_WOPI_URL=%s\n' "$APP_URL"
            printf 'COLLABORA_SERVER_NAME=%s\n' "$APP_HOST"
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'SUPERADMIN_DATABASE_URL=%s\n' "$SUPERADMIN_DATABASE_URL"
            printf 'REDIS_URL=%s\n' "$REDIS_URL"
            printf 'RUNTIME_DB_NETWORK=%s\n' "$RUNTIME_DOCKER_NETWORK"
            printf 'APP_URL=%s\n' "$APP_URL"
            printf 'BETTER_AUTH_SECRET=%s\n' "$BETTER_AUTH_SECRET"
            printf 'ATTACHMENT_CAPABILITY_SECRET=%s\n' "$ATTACHMENT_CAPABILITY_SECRET"
            printf 'R2_ENDPOINT=%s\n' "$R2_ENDPOINT"
            printf 'R2_ACCESS_KEY_ID=%s\n' "$R2_ACCESS_KEY_ID"
            printf 'R2_SECRET_ACCESS_KEY=%s\n' "$R2_SECRET_ACCESS_KEY"
            printf 'R2_BUCKET=%s\n' "$R2_BUCKET"
            printf 'R2_PRIVATE_BUCKET_CONFIRMED=%s\n' "$R2_PRIVATE_BUCKET_CONFIRMED"
            printf 'VAPID_PUBLIC_KEY=%s\n' "$VAPID_PUBLIC_KEY"
            printf 'VAPID_PRIVATE_KEY=%s\n' "$VAPID_PRIVATE_KEY"
            printf 'VAPID_SUBJECT=%s\n' "$VAPID_SUBJECT"
            printf 'SENTRY_DSN=%s\n' "$SENTRY_DSN"
          } > "$env_block_file"
          jq -n --arg id "$COMPOSE_ID" --arg cf "$COMPOSE_FILE" \
            --argjson registry "$DOKPLOY_EXISTING_REGISTRY_ID_JSON" \
            --rawfile env "$env_block_file" \
            '{composeId:$id, sourceType:"raw", composeType:"stack",
              composeFile:$cf, env:$env, command:"", autoDeploy:false,
              randomize:false, isolatedDeployment:false,
              isolatedDeploymentsVolume:false, suffix:"",
              composePath:"./docker-compose.yml", registryId:$registry}' \
            | scripts/cluster/dokploy-curl.sh -sS --fail --connect-timeout 5 --max-time 30 \
                --noproxy "${DOKPLOY_CURL_RESOLVE%%:*}" \
                --resolve "$DOKPLOY_CURL_RESOLVE" -o "$update_response" \
                -X POST "${DOKPLOY_URL%/}/api/compose.update" \
                -H "content-type: application/json" --data @-
          # Re-read and prove the persisted compose matches what we sent — a
          # 2xx acknowledgement alone has been observed to be ambiguous.
          scripts/cluster/dokploy-curl.sh -sS --fail --connect-timeout 5 --max-time 20 \
            --retry 2 --retry-delay 2 --retry-max-time 30 \
            --noproxy "${DOKPLOY_CURL_RESOLVE%%:*}" --resolve "$DOKPLOY_CURL_RESOLVE" \
            -G -o "$compose_state" "${DOKPLOY_URL%/}/api/compose.one" \
            --data-urlencode "composeId=$COMPOSE_ID"
          if ! jq -e --arg cid "$COMPOSE_ID" --arg cf "$COMPOSE_FILE" \
              --rawfile env "$env_block_file" '
                .composeId==$cid and .serverId==null
                  and .composeFile==$cf and .env==$env
                  and .composeType=="stack" and .sourceType=="raw"
                  and .autoDeploy==false' "$compose_state" >/dev/null; then
            echo "::error::Dokploy compose/environment postcondition failed after the update"
            exit 1
          fi
          echo "Updated Dokploy compose environment for $IMAGE"

      - name: Deploy the compose on Dokploy
        if: env.DOKPLOY_DEPLOY_MODE == 'api'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          COMPOSE_ID: ${{ env.DOKPLOY_COMPOSE_ID }}
        run: |
          set -euo pipefail
          jq -n --arg id "$COMPOSE_ID" '{composeId:$id}' \
            | scripts/cluster/dokploy-curl.sh -sS --fail --connect-timeout 5 --max-time 60 \
                --noproxy "${DOKPLOY_CURL_RESOLVE%%:*}" \
                --resolve "$DOKPLOY_CURL_RESOLVE" \
                -X POST "${DOKPLOY_URL%/}/api/compose.deploy" \
                -H "content-type: application/json" --data @- >/dev/null
          echo "Dokploy compose deployment requested"

      - name: Roll the immutable image directly on Swarm
        if: env.DOKPLOY_DEPLOY_MODE == 'direct'
        run: |
          set -euo pipefail
          image="${DEPLOY_IMAGE_NAME}@${IMAGE_DIGEST}"
          for role in web worker scheduler; do
            service="${DOKPLOY_TARGET_STACK}_${role}"
            docker service update --detach=true --with-registry-auth \
              --image "$image" --env-rm APP_VERSION \
              --env-add "APP_VERSION=$DEPLOY_SOURCE_SHA" "$service"
          done
          docker service update --detach=true --with-registry-auth \
            --image "$image" "${DOKPLOY_TARGET_STACK}_storage-init"
          echo "Requested direct immutable-image rollout for $DOKPLOY_TARGET_STACK"

      - name: Wait for external readiness
        env:
          APP_URL: ${{ secrets.DEV_APP_URL }}
        run: |
          set -euo pipefail
          ready_url="${APP_URL%/}/api/health/ready"
          login_url="${APP_URL%/}/login"
          deadline=$((SECONDS + 600))
          last_login_status="not checked"
          while [ "$SECONDS" -lt "$deadline" ]; do
            body="$(curl -fsS --connect-timeout 5 --max-time 15 "$ready_url" 2>/dev/null || true)"
            if [ -n "$body" ] \
              && jq -e --arg sha "$DEPLOY_SOURCE_SHA" \
                  '.status=="ready" and .version==$sha' <<< "$body" >/dev/null 2>&1; then
              last_login_status="$(curl -sS -o /dev/null -w '%{http_code}' \
                --connect-timeout 5 --max-time 15 "$login_url" || true)"
              if [ "$last_login_status" = 200 ]; then
                echo "Deployment is externally ready at commit $DEPLOY_SOURCE_SHA"
                echo "Login page responds 200 — deployment healthy"
                exit 0
              fi
              echo "Readiness reports the new commit; /login returned HTTP ${last_login_status:-000}. Retrying."
            fi
            sleep 10
          done
          echo "::error::Deployment did not become externally ready with a healthy login page within 10 minutes (last /login status: ${last_login_status:-000})"
          exit 1
