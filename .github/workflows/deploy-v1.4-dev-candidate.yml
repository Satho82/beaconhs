name: Recover Run 21 DEV writers only

# Recovery branch only. The validated feature and main dispatchers are unchanged.
# Reuse this registered workflow path to dispatch without changing main.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Must equal the authorised Run 21 candidate SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  recover:
    name: Re-fence and restore approved DEV writers
    if: github.repository == 'Satho82/beaconhs' && github.ref == 'refs/heads/recovery/uvanoo-v1.4-run21'
    runs-on: [self-hosted, dokploy]
    timeout-minutes: 20
    env:
      FEATURE_CANDIDATE_VERIFIED: 'true'
      DOKPLOY_DEPLOY_MODE: api
      DOKPLOY_TARGET_STACK: uvanoo-v1-4-dev-gniriv
      DOKPLOY_COMPOSE_ID: wYb0LxLQrvj2FPI21i-Oj
      EXPECTED_APP_HOST: dev.uvanoo.com
      DEPLOY_SOURCE_SHA: 3e753ac2306e7866fe2d3e8af3fd64188bc9e13a
      IMAGE_DIGEST: sha256:28ecd078f472b4402fffdcf88c3b932a97e93bde45ca6b39a440668862c27144
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: 3e753ac2306e7866fe2d3e8af3fd64188bc9e13a
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .recovery-governance
          persist-credentials: false
      - name: Verify pinned source and authoritative run evidence
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
          RECOVERY_SHA: ${{ github.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$REQUESTED_SHA" = "$DEPLOY_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$DEPLOY_SOURCE_SHA"
          test "$(git -C .recovery-governance rev-parse HEAD)" = "$RECOVERY_SHA"
          node .recovery-governance/scripts/ci/run21-recovery-preflight.mjs evidence
      - name: Configure TLS-preserving Dokploy split-DNS resolution
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_RESOLVE_IP: ${{ secrets.DOKPLOY_RESOLVE_IP }}
        run: |
          set -euo pipefail
          dokploy_host="${DOKPLOY_URL#https://}"
          if [ "$dokploy_host" = "$DOKPLOY_URL" ] \
            || [ "${#dokploy_host}" -gt 253 ] \
            || ! [[ "$dokploy_host" =~ ^([A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?$ ]]; then
            echo "::error::DOKPLOY_URL must be an HTTPS origin with a DNS hostname, no port, path, query, fragment, or trailing slash"
            exit 1
          fi
          if ! [[ "$DOKPLOY_RESOLVE_IP" =~ ^(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ ]]; then
            echo "::error::DOKPLOY_RESOLVE_IP must be a canonical private IPv4 address"
            exit 1
          fi
          IFS=. read -r ip_a ip_b ip_c ip_d <<< "$DOKPLOY_RESOLVE_IP"
          for octet in "$ip_a" "$ip_b" "$ip_c" "$ip_d"; do
            if [ "$((10#$octet))" -gt 255 ]; then
              echo "::error::DOKPLOY_RESOLVE_IP must be a canonical private IPv4 address"
              exit 1
            fi
          done
          if ! (( ip_a == 10 \
            || (ip_a == 172 && ip_b >= 16 && ip_b <= 31) \
            || (ip_a == 192 && ip_b == 168) )); then
            echo "::error::DOKPLOY_RESOLVE_IP must be an RFC 1918 private IPv4 address"
            exit 1
          fi
          printf 'DOKPLOY_CURL_RESOLVE=%s\n' \
            "${dokploy_host}:443:${DOKPLOY_RESOLVE_IP}" >> "$GITHUB_ENV"

      - name: Check database safety legacy writer and exact service identities
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
        run: node .recovery-governance/scripts/ci/run21-recovery-preflight.mjs before
      - name: Apply existing governed writer fence
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
        run: node scripts/cluster/dev-writer-fence.mjs fence
      - name: Verify persisted fence and zero governed writers
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/cluster/dev-writer-fence.mjs verify-zero
          node .recovery-governance/scripts/ci/run21-recovery-preflight.mjs zero
          node .recovery-governance/scripts/ci/run21-recovery-preflight.mjs settled
      - name: Restore using existing governed writer mechanism
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
        run: node scripts/cluster/dev-writer-fence.mjs restore
      - name: Verify final writers and database clients
        run: node .recovery-governance/scripts/ci/run21-recovery-preflight.mjs after
      - name: Verify internal exact-SHA readiness and external Basic Auth
        run: node scripts/cluster/dev-readiness.mjs
      - name: Report recovery outcome
        if: always()
        env:
          RECOVERY_STATUS: ${{ job.status }}
        run: |
          printf 'Run 21 writer recovery: %s\nCandidate: %s\nDigest: %s\n' \
            "$RECOVERY_STATUS" "$DEPLOY_SOURCE_SHA" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo 'No migration, build, image change or automatic failure recovery was performed.' >> "$GITHUB_STEP_SUMMARY"
