name: Isolated DEV execution gates and image (no deployment)

on:
  push:
    branches: [fix/uvanoo-dev-maintenance-hold-20261014]

permissions:
  contents: read
  packages: write

jobs:
  validate-and-build:
    if: github.repository == 'Satho82/beaconhs' && github.ref == 'refs/heads/fix/uvanoo-dev-maintenance-hold-20261014'
    uses: ./.github/workflows/uvanoo-v1.4-cloud-build.yml
    with:
      source_sha: ${{ github.sha }}
    # No secrets inheritance, DEV environment, self-hosted runner or deploy caller.
