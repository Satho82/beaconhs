name: DEV migration gate isolated validation

permissions:
  contents: read

on:
  push:
    branches: [review/uvanoo-v1.4-dev-migration-gate-cloud-20261012]

jobs:
  ci:
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beaconhs_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      CI: 'true'
      DEV_GATE_DISPOSABLE: 'true'
      DATABASE_URL: postgresql://beaconhs_app:beaconhs_app@localhost:5432/beaconhs_test
      MIGRATION_DATABASE_URL: postgresql://beaconhs_migrator:beaconhs_migrator@localhost:5432/beaconhs_test
      SUPERADMIN_DATABASE_URL: postgresql://beaconhs_super:beaconhs_super@localhost:5432/beaconhs_test
      DATABASE_OWNER_ROLE: beaconhs_owner
      DATABASE_BACKUP_ROLE: beaconhs_backup
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-secret-not-used-in-prod
      ATTACHMENT_CAPABILITY_SECRET: ci-attachment-capability-secret-32-chars
      BETTER_AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      # No version here — package.json's packageManager field pins pnpm; passing
      # both errors "Multiple versions of pnpm specified". Node 24 matches the
      # deploy image and package engines.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply isolated review payload
        run: |
          python3 - <<'PY'
          import json,pathlib
          for name,content in json.loads(pathlib.Path('.github/dev-gate.patch').read_text()).items():
              p=pathlib.Path(name)
              assert not p.is_absolute() and '..' not in p.parts
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(content)
          PY
      - name: Format only proposed source files
        run: |
          python3 - <<'PY'
          import json,subprocess
          names=[p for p in json.load(open('.github/dev-gate.patch')) if p.endswith(('.ts','.json','.md'))]
          subprocess.run(['pnpm','exec','prettier','--write',*names],check=True)
          PY

      - name: Provision isolated owner, migration, and RLS roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE beaconhs_owner NOLOGIN NOSUPERUSER NOBYPASSRLS;
          CREATE ROLE beaconhs_migrator LOGIN NOINHERIT NOSUPERUSER NOBYPASSRLS PASSWORD 'beaconhs_migrator';
          CREATE ROLE beaconhs_app LOGIN NOINHERIT NOSUPERUSER NOBYPASSRLS PASSWORD 'beaconhs_app';
          CREATE ROLE beaconhs_super LOGIN NOINHERIT NOSUPERUSER BYPASSRLS PASSWORD 'beaconhs_super';
          CREATE ROLE beaconhs_backup LOGIN NOINHERIT NOSUPERUSER BYPASSRLS PASSWORD 'beaconhs_backup';
          ALTER ROLE beaconhs_backup SET default_transaction_read_only = 'on';
          GRANT beaconhs_owner TO beaconhs_migrator;
          ALTER DATABASE beaconhs_test OWNER TO beaconhs_owner;
          REVOKE ALL ON DATABASE beaconhs_test FROM PUBLIC;
          GRANT CONNECT ON DATABASE beaconhs_test TO beaconhs_migrator, beaconhs_app, beaconhs_super, beaconhs_backup;
          \connect beaconhs_test
          ALTER SCHEMA public OWNER TO beaconhs_owner;
          REVOKE ALL ON SCHEMA public FROM PUBLIC;
          SQL
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm deadcode:check
      - name: Test deployment host safeguards
        run: |
          scripts/cluster/dokploy-curl.test.sh
          scripts/ci/require-current-main.test.sh
          scripts/ci/workflow-repository-immutability.test.sh
          scripts/ci/v1.4-dev-candidate-deploy-contract.test.sh
      - name: Apply the production migration path
        run: pnpm --filter @beaconhs/db exec tsx src/migrate.ts
      - name: Prove migrations are idempotent
        run: pnpm --filter @beaconhs/db exec tsx src/migrate.ts
      - name: Disposable 58 61 62 to 63 and drift regressions
        run: |
          git fetch --no-tags origin 937242e7e35806acab48c28c4163719b00c0f16d
          pnpm --filter @beaconhs/db exec tsx src/dev-migration-gate.integration.ts
      - name: People provenance and Risk SQL regressions
        env:
          PGPASSWORD: postgres
          PEOPLE_PROVENANCE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/beaconhs_test
        run: |
          pnpm --filter @beaconhs/db exec tsx src/people-provenance.integration.ts
          psql -h localhost -U postgres -d beaconhs_test -X -v ON_ERROR_STOP=1 < packages/db/src/risk-revisions-rls.integration.sql
      - name: Migration Safety isolated rollback and ACL harness
        run: |
          set -euo pipefail
          docker pull postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
          docker tag postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777 postgres:16-alpine
          docker run --detach --rm --name uvanoo-migration-safety-20261012 \
            --label uvanoo.task=migration-safety --network none --memory 768m --cpus 2 \
            --tmpfs /var/lib/postgresql/data:rw \
            -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=safety_admin postgres:16-alpine
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec uvanoo-migration-safety-20261012 pg_isready -U postgres -d safety_admin; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          pnpm --filter @beaconhs/db exec tsx src/migration-safety.integration.ts

      - name: Dispose only task-owned Migration Safety fixture
        if: always()
        run: |
          set -euo pipefail
          if docker inspect uvanoo-migration-safety-20261012 >/dev/null 2>&1; then
            test "$(docker inspect --format '{{ index .Config.Labels "uvanoo.task" }}' uvanoo-migration-safety-20261012)" = migration-safety
            docker stop uvanoo-migration-safety-20261012
          fi

      - run: pnpm test
      - name: Record validated formatted proposal bytes
        if: always()
        run: |
          python3 - <<'PY'
          import base64,json,pathlib,hashlib
          for name in json.load(open('.github/dev-gate.patch')):
              b=pathlib.Path(name).read_bytes()
              print('DEV_GATE_FILE '+json.dumps({'path':name,'sha256':hashlib.sha256(b).hexdigest(),'base64':base64.b64encode(b).decode()}))
          PY


  build:
    name: Production build
    needs: ci
    runs-on: ubuntu-latest
    steps:
      # Build on a fresh runner: Next/Webpack no longer competes with the
      # database, Redis, and test-process memory held by the quality gate.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply isolated review payload
        run: |
          python3 - <<'PY'
          import json,pathlib
          for name,content in json.loads(pathlib.Path('.github/dev-gate.patch').read_text()).items():
              p=pathlib.Path(name)
              assert not p.is_absolute() and '..' not in p.parts
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(content)
          PY
      - name: Format only proposed source files
        run: |
          python3 - <<'PY'
          import json,subprocess
          names=[p for p in json.load(open('.github/dev-gate.patch')) if p.endswith(('.ts','.json','.md'))]
          subprocess.run(['pnpm','exec','prettier','--write',*names],check=True)
          PY

      # Keep a bounded V8 heap below the hosted runner's physical-memory limit.
      - run: pnpm build --concurrency=1
        env:
          NODE_OPTIONS: --max-old-space-size=6144
