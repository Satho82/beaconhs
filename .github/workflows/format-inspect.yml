name: Inspect platform formatting

on:
  push:
    branches: [feature/uvanoo-v1.3-platform-foundation]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print Prettier diff
        run: |
          pnpm exec prettier --write 'apps/web/src/app/(app)/platform/layout.tsx'
          git diff --no-ext-diff -- 'apps/web/src/app/(app)/platform/layout.tsx'
