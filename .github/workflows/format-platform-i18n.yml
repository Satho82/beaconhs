name: Format Platform I18n

on:
  push:
    branches: [feature/uvanoo-v1.3-platform-foundation]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write 'apps/web/src/app/(app)/platform/layout.tsx'
      - run: |
          git rm .github/workflows/format-platform-i18n.yml
          git add 'apps/web/src/app/(app)/platform/layout.tsx' .github/workflows/format-platform-i18n.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(i18n): format platform layout"
          git push
