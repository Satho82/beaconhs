name: Inspect Generated I18n Keys
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const branch = 'feature/uvanoo-v1.3-platform-foundation'
            const { owner, repo } = context.repo
            const ref = await github.rest.git.getRef({ owner, repo, ref: 'heads/' + branch })
            const commit = await github.rest.git.getCommit({ owner, repo, commit_sha: ref.data.object.sha })
            const tree = await github.rest.git.getTree({ owner, repo, tree_sha: commit.data.tree.sha, recursive: 'true' })
            for (const path of ['packages/i18n/src/messages/en.json', 'packages/i18n/src/messages/es.json', 'packages/i18n/src/messages/fr.json']) {
              const entry = tree.data.tree.find((candidate) => candidate.path === path)
              const blob = await github.rest.git.getBlob({ owner, repo, file_sha: entry.sha })
              const parsed = JSON.parse(Buffer.from(blob.data.content, 'base64').toString('utf8'))
              core.notice(path + ' dashboard=' + JSON.stringify(parsed.Generated['m_0c7e907b633729']) + ' keys=' + Object.keys(parsed.Generated).length)
            }
