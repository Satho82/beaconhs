name: Repair Platform Generated Catalog
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const branch = 'feature/uvanoo-v1.3-platform-foundation'
            const files = ['packages/i18n/src/messages/en.json', 'packages/i18n/src/messages/es.json', 'packages/i18n/src/messages/fr.json']
            const copy = {
              Dashboard: ['Dashboard', 'Panel', 'Tableau de bord'],
              'Uvanoo Platform Control Centre': ['Uvanoo Platform Control Centre', 'Centro de control de la plataforma Uvanoo', 'Centre de contrôle de la plateforme Uvanoo'],
              'Platform context · tenant and property scope do not grant platform authority': ['Platform context · tenant and property scope do not grant platform authority', 'Contexto de plataforma · el ámbito de inquilino y propiedad no concede autoridad de plataforma', 'Contexte de plateforme · la portée du locataire et de la propriété n’accorde pas d’autorité de plateforme'],
              'Platform navigation': ['Platform navigation', 'Navegación de la plataforma', 'Navigation de la plateforme'],
              'Management companies': ['Management companies', 'Empresas de gestión', 'Sociétés de gestion'],
              'Platform users': ['Platform users', 'Usuarios de plataforma', 'Utilisateurs de la plateforme'],
              Communications: ['Communications', 'Comunicaciones', 'Communications'],
              Branding: ['Branding', 'Marca', 'Image de marque'],
              'System health': ['System health', 'Estado del sistema', 'État du système'],
              Suspend: ['Suspend', 'Suspender', 'Suspendre'],
              Reactivate: ['Reactivate', 'Reactivar', 'Réactiver'],
              Archive: ['Archive', 'Archivar', 'Archiver'],
              'Invalid tenant.': ['Invalid tenant.', 'Inquilino no válido.', 'Locataire non valide.'],
              'Invalid tenant status change.': ['Invalid tenant status change.', 'Cambio de estado de inquilino no válido.', 'Changement de statut du locataire non valide.'],
              'Tenant not found.': ['Tenant not found.', 'Inquilino no encontrado.', 'Locataire introuvable.'],
              'Changed {value0} status from {value1} to {value2}': ['Changed {value0} status from {value1} to {value2}', 'Se cambió el estado de {value0} de {value1} a {value2}', 'Le statut de {value0} est passé de {value1} à {value2}'],
              'Only platform super-admins can perform this operation.': ['Only platform super-admins can perform this operation.', 'Solo los superadministradores de plataforma pueden realizar esta operación.', 'Seuls les superadministrateurs de la plateforme peuvent effectuer cette opération.'],
            }
            function key(source) {
              let high = 0xdeadbeef, low = 0x41c6ce57
              for (let i = 0; i < source.length; i += 1) {
                const code = source.charCodeAt(i)
                high = Math.imul(high ^ code, 2654435761)
                low = Math.imul(low ^ code, 1597334677)
              }
              high = Math.imul(high ^ (high >>> 16), 2246822507)
              high ^= Math.imul(low ^ (low >>> 13), 3266489909)
              low = Math.imul(low ^ (low >>> 16), 2246822507)
              low ^= Math.imul(high ^ (high >>> 13), 3266489909)
              return 'm_' + (4294967296 * (2097151 & low) + (high >>> 0)).toString(16).padStart(14, '0')
            }
            const { owner, repo } = context.repo
            const ref = await github.rest.git.getRef({ owner, repo, ref: 'heads/' + branch })
            const parentSha = ref.data.object.sha
            const parent = await github.rest.git.getCommit({ owner, repo, commit_sha: parentSha })
            const parentTree = await github.rest.git.getTree({ owner, repo, tree_sha: parent.data.tree.sha, recursive: 'true' })
            const tree = []
            for (let locale = 0; locale < files.length; locale += 1) {
              const entry = parentTree.data.tree.find((candidate) => candidate.path === files[locale])
              const blob = await github.rest.git.getBlob({ owner, repo, file_sha: entry.sha })
              const document = JSON.parse(Buffer.from(blob.data.content, 'base64').toString('utf8'))
              for (const [source, translations] of Object.entries(copy)) document.Generated[key(source)] = translations[locale]
              const nextBlob = await github.rest.git.createBlob({ owner, repo, content: JSON.stringify(document, null, 2) + '\n', encoding: 'utf-8' })
              tree.push({ path: files[locale], mode: '100644', type: 'blob', sha: nextBlob.data.sha })
            }
            for (const path of ['.github/workflows/inspect-generated-i18n.yml', '.github/workflows/repair-platform-generated-catalog.yml']) {
              tree.push({ path, mode: '100644', type: 'blob', sha: null })
            }
            const nextTree = await github.rest.git.createTree({ owner, repo, base_tree: parent.data.tree.sha, tree })
            const next = await github.rest.git.createCommit({ owner, repo, message: 'fix(i18n): synchronize platform generated catalogs', tree: nextTree.data.sha, parents: [parentSha] })
            const verificationTree = await github.rest.git.getTree({ owner, repo, tree_sha: nextTree.data.sha, recursive: 'true' })
            for (const path of files) {
              const entry = verificationTree.data.tree.find((candidate) => candidate.path === path)
              const blob = await github.rest.git.getBlob({ owner, repo, file_sha: entry.sha })
              const document = JSON.parse(Buffer.from(blob.data.content, 'base64').toString('utf8'))
              for (const source of Object.keys(copy)) {
                if (document.Generated[key(source)] === undefined) throw new Error('Missing ' + key(source) + ' in ' + path)
              }
            }
            await github.rest.git.updateRef({ owner, repo, ref: 'heads/' + branch, sha: next.data.sha, force: false })
