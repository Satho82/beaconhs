name: Uvanoo combined release integration validation

# Read-only control workflow validating exact immutable candidates in disposable services. This workflow
# deliberately has no deploy, image, registry, SSH, or environment path.
on:
  push:
    branches: [review/uvanoo-v1.4-combined-validation-20261012]
    paths: [.github/workflows/uvanoo-combined-release.yml]

permissions:
  contents: read

concurrency:
  group: uvanoo-combined-release-${{ github.sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Committed Approvals release and preserved People Risk gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: migration-safety
            source_sha: 563fb0e9b79a838a5f394abaffb2f7dc743fc571
            source_branch: integration/uvanoo-v1.4-approvals-dev-gate-20261012
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beaconhs_test
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d beaconhs_test"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports: ['127.0.0.1:6379:6379']
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      R2_ENDPOINT: http://localhost:9000
      R2_ACCESS_KEY_ID: beaconhs
      R2_SECRET_ACCESS_KEY: beaconhs-dev-secret
      R2_BUCKET: approvals-disposable
      DEV_GATE_DISPOSABLE: 'true'
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://beaconhs_app:beaconhs_app@localhost:5432/beaconhs_test
      MIGRATION_DATABASE_URL: postgresql://beaconhs_migrator:beaconhs_migrator@localhost:5432/beaconhs_test
      SUPERADMIN_DATABASE_URL: postgresql://beaconhs_super:beaconhs_super@localhost:5432/beaconhs_test
      PEOPLE_PROVENANCE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/beaconhs_test
      DATABASE_OWNER_ROLE: beaconhs_owner
      DATABASE_BACKUP_ROLE: beaconhs_backup
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: module-validation-disposable-secret-not-production
      ATTACHMENT_CAPABILITY_SECRET: module-validation-disposable-capability-secret
      BETTER_AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000

    steps:
      - name: Verify control branch and immutable input shape
        env:
          SOURCE_SHA: ${{ matrix.source_sha }}
          SOURCE_BRANCH: ${{ matrix.source_branch }}
          MODULE: ${{ matrix.module }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Satho82/beaconhs'
          test "$GITHUB_REF" = 'refs/heads/review/uvanoo-v1.4-combined-validation-20261012'
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$MODULE:$SOURCE_BRANCH:$SOURCE_SHA" in
            migration-safety:integration/uvanoo-v1.4-approvals-dev-gate-20261012:563fb0e9b79a838a5f394abaffb2f7dc743fc571) ;;
            *) exit 1 ;;
          esac
          [[ "$MODULE" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]]

      - name: Checkout validation control definition
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify source branch provenance and checkout exact candidate
        env:
          SOURCE_SHA: ${{ matrix.source_sha }}
          SOURCE_BRANCH: ${{ matrix.source_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$SOURCE_SHA" c306bd6bbe0571eeca18a410c1ac08fe55c524b6
          test "$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)" = "$SOURCE_SHA"
          test "$(git show -s --format=%P "$SOURCE_SHA")" = 6f7048965e8136aaf4067555e93fc048ef2cecb5
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = 324c50a60e2cb0639ba920488a150c6531968374
          test "$(git status --porcelain)" = ''
          git diff --check c306bd6bbe0571eeca18a410c1ac08fe55c524b6 HEAD
          git diff --exit-code c306bd6bbe0571eeca18a410c1ac08fe55c524b6 HEAD -- 'packages/db/drizzle/00[0-5]*.sql' 'packages/db/drizzle/006[0-2]*.sql' 'apps/web/src/lib/people' 'apps/web/src/app/(app)/people' 'apps/web/src/lib/risk'
          test "$(git rev-parse HEAD:packages/db/drizzle/0063_approvals_production.sql)" = 000d76e52c965c6487707f20cd4a7f1c13436e3d
          printf 'candidate_sha=%s\nsource_branch=%s\n' "$SOURCE_SHA" "$SOURCE_BRANCH" >> "$GITHUB_STEP_SUMMARY"

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Verify pinned toolchain and disposable service boundaries
        run: |
          set -euo pipefail
          test "$(node --version)" = "v$(tr -d '\r\n' < .nvmrc)"
          test "pnpm@$(pnpm --version)" = "$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager')"
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          expected = {
              'DATABASE_URL': 'beaconhs_app',
              'MIGRATION_DATABASE_URL': 'beaconhs_migrator',
              'SUPERADMIN_DATABASE_URL': 'beaconhs_super',
              'PEOPLE_PROVENANCE_TEST_DATABASE_URL': 'postgres',
          }
          for name, user in expected.items():
              value = urlparse(os.environ[name])
              if (value.scheme, value.hostname, value.port, value.path, value.username, value.query) != (
                  'postgresql', 'localhost', 5432, '/beaconhs_test', user, ''):
                  raise SystemExit('Rejected database boundary: ' + name)
          if os.environ['REDIS_URL'] != 'redis://localhost:6379':
              raise SystemExit('Rejected Redis boundary')
          PY

      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile

      - name: Record preserved focused evidence
        run: |
          printf '%s\n' 'Focused evidence preserved: 38299763258 and 38300015941; exact recovered source identity proven by 38306009284. Full workspace tests below are the mandatory committed-source release gate.' >> "$GITHUB_STEP_SUMMARY"

      - name: Provision disposable database roles
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE beaconhs_owner NOLOGIN NOSUPERUSER NOBYPASSRLS;
          CREATE ROLE beaconhs_migrator LOGIN NOINHERIT NOSUPERUSER NOBYPASSRLS PASSWORD 'beaconhs_migrator';
          CREATE ROLE beaconhs_app LOGIN NOINHERIT NOSUPERUSER NOBYPASSRLS PASSWORD 'beaconhs_app';
          CREATE ROLE beaconhs_super LOGIN NOINHERIT NOSUPERUSER BYPASSRLS PASSWORD 'beaconhs_super';
          CREATE ROLE beaconhs_backup LOGIN NOINHERIT NOSUPERUSER BYPASSRLS PASSWORD 'beaconhs_backup';
          ALTER ROLE beaconhs_backup SET default_transaction_read_only = 'on';
          GRANT beaconhs_owner TO beaconhs_migrator;
          ALTER DATABASE beaconhs_test OWNER TO beaconhs_owner;
          REVOKE ALL ON DATABASE beaconhs_test FROM PUBLIC;
          GRANT CONNECT ON DATABASE beaconhs_test TO beaconhs_migrator, beaconhs_app, beaconhs_super, beaconhs_backup;
          \connect beaconhs_test
          ALTER SCHEMA public OWNER TO beaconhs_owner;
          REVOKE ALL ON SCHEMA public FROM PUBLIC;
          SQL

      - name: Formatting
        run: pnpm format:check
      - name: Fresh route types
        run: |
          set -euo pipefail
          test ! -d apps/web/.next
          pnpm --filter @beaconhs/web exec next typegen
          git diff --exit-code -- apps/web/tsconfig.json apps/web/next.config.ts
      - name: Typecheck
        run: pnpm typecheck --concurrency=1
      - name: Database typecheck
        run: pnpm --filter @beaconhs/db typecheck
      - name: Lint
        run: pnpm lint --concurrency=1
      - name: Dead-code gate
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm deadcode:check

      - name: Validate migration journal and apply migrations
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs')
          const journal = JSON.parse(fs.readFileSync('packages/db/drizzle/meta/_journal.json', 'utf8'))
          const tags = journal.entries.map((entry) => entry.tag)
          if (tags.length !== 63 || tags.at(-1) !== '0063_approvals_production') throw new Error('Expected exact 63-migration recovery journal')
          if (new Set(tags).size !== tags.length || !tags.every((tag) => /^\d{4}_[a-z0-9_]+$/.test(tag))) {
            throw new Error('Invalid or duplicate migration journal entries')
          }
          console.log(`migration-journal-ok: ${tags.length} entries; terminal=${tags.at(-1)}`)
          NODE
          pnpm --filter @beaconhs/db exec tsx src/migrate.ts
      - name: Prove migration idempotence
        run: pnpm --filter @beaconhs/db exec tsx src/migrate.ts

      - name: Strict DEV prefixes and schema security drift rejection
        run: |
          git fetch --no-tags origin 937242e7e35806acab48c28c4163719b00c0f16d d18f635a41f092e9e86aa6f53518f9c28992b0d2 c306bd6bbe0571eeca18a410c1ac08fe55c524b6
          pnpm --filter @beaconhs/db exec tsx src/dev-migration-gate.integration.ts

      - name: Unit and regression tests
        run: pnpm test --concurrency=1
      - name: Build pinned disposable storage from official source
        run: |
          set -euo pipefail
          GOBIN=/tmp/uvanoo-storage-bin go install github.com/minio/minio@07c3a429bfed433e49018cb0f78a52145d4bedeb
          mkdir -m 700 /tmp/uvanoo-storage-data
          MINIO_ROOT_USER=beaconhs MINIO_ROOT_PASSWORD=beaconhs-dev-secret /tmp/uvanoo-storage-bin/minio server --address 127.0.0.1:9000 /tmp/uvanoo-storage-data > /tmp/uvanoo-storage.log 2>&1 &
          echo $! > /tmp/uvanoo-storage.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:9000/minio/health/live; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:9000/minio/health/live
      - name: Production lifecycle and financial security integration
        timeout-minutes: 10
        run: pnpm --filter @beaconhs/web exec tsx scripts/verify-approvals-production.ts
      - name: Dispose task storage
        if: always()
        run: |
          if test -f /tmp/uvanoo-storage.pid; then
            kill "$(cat /tmp/uvanoo-storage.pid)" || true
          fi


      - name: Cross-tenant and cross-property enforcement
        env:
          UVANOO_PROPERTY_DELEGATION_INTEGRATION: '1'
          # Fixture setup deliberately SET ROLEs to the restricted app role.
          # Use the disposable cluster admin only for this rollback-only test;
          # the production maintenance role must not gain extra membership.
          SUPERADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/beaconhs_test
        run: pnpm --filter @beaconhs/web exec vitest run src/lib/property-delegation.integration.test.ts
      - name: Real People provenance and RLS boundary tests
        env:
          UVANOO_PEOPLE_PROVENANCE_INTEGRATION: '1'
        run: pnpm --filter @beaconhs/db test:people-provenance
      - name: Related real property RLS regressions
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for fixture in action-property hospitality-handover-rls hospitality-metering-rls maintenance-evidence-rls incident-property-rls inspection-compliance-property-rls; do
            if [ "$fixture" = action-property ]; then
              pnpm --silent --filter @beaconhs/db run test:action-property-sql | psql -h localhost -U postgres -d beaconhs_test -X -v ON_ERROR_STOP=1
            else
              psql -h localhost -U postgres -d beaconhs_test -X -v ON_ERROR_STOP=1 < "packages/db/src/${fixture}.integration.sql"
            fi
          done

      - name: Closed Risk revision regression
        if: matrix.module == 'migration-safety'
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d beaconhs_test -X -v ON_ERROR_STOP=1 < packages/db/src/risk-revisions-rls.integration.sql

      - name: Migration Safety isolated rollback and ACL harness
        if: matrix.module == 'migration-safety'
        run: |
          set -euo pipefail
          docker pull postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
          docker tag postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777 postgres:16-alpine
          docker run --detach --rm --name uvanoo-migration-safety-20261012 \
            --label uvanoo.task=migration-safety --network none --memory 768m --cpus 2 \
            --tmpfs /var/lib/postgresql/data:rw \
            -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=safety_admin postgres:16-alpine
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec uvanoo-migration-safety-20261012 pg_isready -U postgres -d safety_admin; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          pnpm --filter @beaconhs/db exec tsx src/migration-safety.integration.ts

      - name: Dispose only task-owned Migration Safety fixture
        if: always() && matrix.module == 'migration-safety'
        run: |
          set -euo pipefail
          if docker inspect uvanoo-migration-safety-20261012 >/dev/null 2>&1; then
            test "$(docker inspect --format '{{ index .Config.Labels "uvanoo.task" }}' uvanoo-migration-safety-20261012)" = migration-safety
            docker stop uvanoo-migration-safety-20261012
          fi

      - name: Deployment contract regressions without deployment
        run: |
          set -euo pipefail
          scripts/cluster/dokploy-curl.test.sh
          scripts/ci/require-current-main.test.sh
          scripts/ci/workflow-repository-immutability.test.sh
          scripts/ci/v1.4-dev-candidate-deploy-contract.test.sh

      - name: Verify exact final source identity
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(git rev-parse HEAD)" = 563fb0e9b79a838a5f394abaffb2f7dc743fc571
          test "$(git rev-parse HEAD^{tree})" = 324c50a60e2cb0639ba920488a150c6531968374
          printf 'VALIDATED_RECOVERY_SHA=%s\nVALIDATED_RECOVERY_TREE=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" | tee -a "$GITHUB_STEP_SUMMARY"

  secret-scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: 563fb0e9b79a838a5f394abaffb2f7dc743fc571
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITLEAKS_VERSION: 8.30.1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: 563fb0e9b79a838a5f394abaffb2f7dc743fc571
          persist-credentials: false
      - uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0


  build:
    name: Combined production web and worker build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 563fb0e9b79a838a5f394abaffb2f7dc743fc571
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Production build only
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -euo pipefail
          memory_kib="$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)"
          test "$memory_kib" -ge 12000000
          pnpm build --concurrency=1
          test -s apps/web/.next/BUILD_ID
          test -f apps/web/.next/standalone/apps/web/server.js
          test -f apps/worker/dist/index.js


      - name: Verify exact final source identity
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(git rev-parse HEAD)" = 563fb0e9b79a838a5f394abaffb2f7dc743fc571
          test "$(git rev-parse HEAD^{tree})" = 324c50a60e2cb0639ba920488a150c6531968374
          printf 'VALIDATED_RECOVERY_SHA=%s\nVALIDATED_RECOVERY_TREE=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" | tee -a "$GITHUB_STEP_SUMMARY"
