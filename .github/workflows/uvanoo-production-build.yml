name: Uvanoo production build verification
on:
  push:
    branches: [review/uvanoo-v1.4-production-completion-cloud-20261012]
    paths: [.github/workflows/uvanoo-production-build.yml]
permissions:
  contents: read
concurrency:
  group: uvanoo-production-build-isolated
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      SUPERADMIN_DATABASE_URL: postgresql://beaconhs_super:beaconhs_super@localhost:5432/beaconhs_test
      NODE_OPTIONS: --max-old-space-size=8192
      DATABASE_URL: postgresql://beaconhs_app:beaconhs_app@localhost:5432/beaconhs_test
      BETTER_AUTH_SECRET: disposable-production-draft-not-a-real-secret
      ATTACHMENT_CAPABILITY_SECRET: disposable-production-draft-capability-secret
      REDIS_URL: redis://localhost:6379
      APP_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Apply isolated draft without publishing production source
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/review/uvanoo-v1.4-production-completion-cloud-20261012
          cp docs/v1.4/production-completion/source-draft.json /tmp/uvanoo-production-draft.json
          cp .github/recovery/prepare-production-draft.ts /tmp/uvanoo-production-prepare.ts
          git checkout --detach c306bd6bbe0571eeca18a410c1ac08fe55c524b6
          python3 - <<'PY'
          import json,pathlib
          d=json.load(open('/tmp/uvanoo-production-draft.json'))
          assert d['base']=='c306bd6bbe0571eeca18a410c1ac08fe55c524b6'
          for p,c in d['files'].items():
              assert p.startswith(('apps/','packages/','docs/')) and '..' not in pathlib.PurePosixPath(p).parts
              dest=pathlib.Path(p); dest.parent.mkdir(parents=True,exist_ok=True); dest.write_text(c)
          PY
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Apply existing localization primitives
        run: |
          cp /tmp/uvanoo-production-prepare.ts apps/web/scripts/prepare-production-draft.ts
          pnpm --filter @beaconhs/web exec tsx scripts/prepare-production-draft.ts
          rm apps/web/scripts/prepare-production-draft.ts
      - name: Format changed draft files only
        run: |
          python3 - <<'PY'
          import json,subprocess
          paths=[p for p in json.load(open('/tmp/uvanoo-production-draft.json'))['files'] if p.endswith(('.ts','.tsx','.json','.md'))]
          paths += ['packages/i18n/src/messages/'+lang+'.json' for lang in ['en','es','fr']]
          subprocess.run(['pnpm','exec','prettier','--write',*paths],check=True)
          PY
      - name: Verify production build
        run: |
          set -euo pipefail
          pnpm build --concurrency=1
          test -s apps/web/.next/BUILD_ID
          test -f apps/web/.next/standalone/apps/web/server.js
          test -f apps/worker/dist/index.js
      - name: Record source tree
        if: always()
        run: |
          git add apps packages
          printf 'DRAFT_SOURCE_TREE=%s\n' "$(git write-tree)"
