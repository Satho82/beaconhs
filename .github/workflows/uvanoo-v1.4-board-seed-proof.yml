name: Uvanoo Board synthetic seed and authentication proof

# Read-only control workflow validating exact immutable candidates in disposable services. This workflow
# deliberately has no deploy, image, registry, SSH, or environment path.
on:
  push:
    branches: [review/uvanoo-v1.4-board-20261016-cloud]
    paths: [.github/workflows/uvanoo-v1.4-board-seed-proof.yml]

permissions:
  contents: read

concurrency:
  group: uvanoo-board-seed-proof-${{ github.sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Synthetic two-hotel preservation and authentication
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: migration-safety
            source_sha: d18f635a41f092e9e86aa6f53518f9c28992b0d2
            source_branch: feature/uvanoo-v1.4
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beaconhs_test
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d beaconhs_test"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports: ['127.0.0.1:6379:6379']
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://beaconhs_app:beaconhs_app@localhost:5432/beaconhs_test
      MIGRATION_DATABASE_URL: postgresql://beaconhs_migrator:beaconhs_migrator@localhost:5432/beaconhs_test
      SUPERADMIN_DATABASE_URL: postgresql://beaconhs_super:beaconhs_super@localhost:5432/beaconhs_test
      PEOPLE_PROVENANCE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/beaconhs_test
      DATABASE_OWNER_ROLE: beaconhs_owner
      DATABASE_BACKUP_ROLE: beaconhs_backup
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: module-validation-disposable-secret-not-production
      ATTACHMENT_CAPABILITY_SECRET: module-validation-disposable-capability-secret
      BETTER_AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000

    steps:
      - name: Verify control branch and immutable input shape
        env:
          SOURCE_SHA: ${{ matrix.source_sha }}
          SOURCE_BRANCH: ${{ matrix.source_branch }}
          MODULE: ${{ matrix.module }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Satho82/beaconhs'
          test "$GITHUB_REF" = 'refs/heads/review/uvanoo-v1.4-board-20261016-cloud'
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$MODULE:$SOURCE_BRANCH:$SOURCE_SHA" in
            migration-safety:feature/uvanoo-v1.4:d18f635a41f092e9e86aa6f53518f9c28992b0d2) ;;
            *) exit 1 ;;
          esac
          [[ "$MODULE" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]]

      - name: Checkout validation control definition
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify source branch provenance and checkout exact candidate
        env:
          SOURCE_SHA: ${{ matrix.source_sha }}
          SOURCE_BRANCH: ${{ matrix.source_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/module-validation-source"
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/module-validation-source
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git status --porcelain)" = ''
          printf 'candidate_sha=%s\nsource_branch=%s\n' "$SOURCE_SHA" "$SOURCE_BRANCH" >> "$GITHUB_STEP_SUMMARY"

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Verify pinned toolchain and disposable service boundaries
        run: |
          set -euo pipefail
          test "$(node --version)" = "v$(tr -d '\r\n' < .nvmrc)"
          test "pnpm@$(pnpm --version)" = "$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager')"
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          expected = {
              'DATABASE_URL': 'beaconhs_app',
              'MIGRATION_DATABASE_URL': 'beaconhs_migrator',
              'SUPERADMIN_DATABASE_URL': 'beaconhs_super',
              'PEOPLE_PROVENANCE_TEST_DATABASE_URL': 'postgres',
          }
          for name, user in expected.items():
              value = urlparse(os.environ[name])
              if (value.scheme, value.hostname, value.port, value.path, value.username, value.query) != (
                  'postgresql', 'localhost', 5432, '/beaconhs_test', user, ''):
                  raise SystemExit('Rejected database boundary: ' + name)
          if os.environ['REDIS_URL'] != 'redis://localhost:6379':
              raise SystemExit('Rejected Redis boundary')
          PY

      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile

      - name: Provision disposable database roles
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE beaconhs_owner NOLOGIN NOSUPERUSER NOBYPASSRLS;
          CREATE ROLE beaconhs_migrator LOGIN NOINHERIT NOSUPERUSER NOBYPASSRLS PASSWORD 'beaconhs_migrator';
          CREATE ROLE beaconhs_app LOGIN NOINHERIT NOSUPERUSER NOBYPASSRLS PASSWORD 'beaconhs_app';
          CREATE ROLE beaconhs_super LOGIN NOINHERIT NOSUPERUSER BYPASSRLS PASSWORD 'beaconhs_super';
          CREATE ROLE beaconhs_backup LOGIN NOINHERIT NOSUPERUSER BYPASSRLS PASSWORD 'beaconhs_backup';
          ALTER ROLE beaconhs_backup SET default_transaction_read_only = 'on';
          GRANT beaconhs_owner TO beaconhs_migrator;
          ALTER DATABASE beaconhs_test OWNER TO beaconhs_owner;
          REVOKE ALL ON DATABASE beaconhs_test FROM PUBLIC;
          GRANT CONNECT ON DATABASE beaconhs_test TO beaconhs_migrator, beaconhs_app, beaconhs_super, beaconhs_backup;
          \connect beaconhs_test
          ALTER SCHEMA public OWNER TO beaconhs_owner;
          REVOKE ALL ON SCHEMA public FROM PUBLIC;
          SQL

      - name: Replay canonical migrations in disposable PostgreSQL
        run: |
          set -euo pipefail
          pnpm --filter @beaconhs/db exec tsx src/migrate.ts
          pnpm --filter @beaconhs/db exec tsx src/migrate.ts

      - name: Real two-hotel seed preservation, login and property isolation
        env:
          CYCAS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/beaconhs_test
        run: scripts/ci/cycas-demo-seed-integration.sh

      - name: Plan the 16 October Board dataset without inserting it
        env:
          NODE_ENV: test
          UVANOO_CYCAS_SEED_TARGET: development
          UVANOO_CYCAS_SEED_CONFIRM: SEED_CYCAS_HOSPITALITY_DEVELOPMENT
          UVANOO_CYCAS_SEED_DRY_RUN: '1'
          UVANOO_CYCAS_SEED_ANCHOR: '2026-10-16T12:00:00.000Z'
        run: pnpm --filter @beaconhs/db exec tsx src/seed-cycas-demo.ts

      - name: Verify source remained unchanged
        run: |
          set -euo pipefail
          git diff --exit-code
          echo 'Synthetic fixtures only; all integration records rolled back. Board date plan was dry-run only. No live seeding or password provisioning.' >> "$GITHUB_STEP_SUMMARY"

  public-readiness:
    name: Read-only DEV readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read public readiness without authentication or mutation
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Satho82/beaconhs
          test "$GITHUB_REF" = refs/heads/review/uvanoo-v1.4-board-20261016-cloud
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 https://dev.uvanoo.com/api/health/ready
