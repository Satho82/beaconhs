name: Uvanoo validation and staging image (no deployment)

permissions:
  contents: read

on:
  push:
    branches: [feature/uvanoo-phase-1-foundation, feature/uvanoo-v1.2]
  workflow_dispatch:

jobs:
  ci:
    if: github.ref == 'refs/heads/feature/uvanoo-phase-1-foundation' || github.ref == 'refs/heads/feature/uvanoo-v1.2'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beaconhs_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      DATABASE_URL: postgresql://beaconhs_app:beaconhs_app@localhost:5432/beaconhs_test
      MIGRATION_DATABASE_URL: postgresql://beaconhs_migrator:beaconhs_migrator@localhost:5432/beaconhs_test
      SUPERADMIN_DATABASE_URL: postgresql://beaconhs_super:beaconhs_super@localhost:5432/beaconhs_test
      DATABASE_OWNER_ROLE: beaconhs_owner
      DATABASE_BACKUP_ROLE: beaconhs_backup
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-secret-not-used-in-prod
      ATTACHMENT_CAPABILITY_SECRET: ci-attachment-capability-secret-32-chars
      BETTER_AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      # No version here — package.json's packageManager field pins pnpm; passing
      # both errors "Multiple versions of pnpm specified". Node 24 matches the
      # deploy image and package engines.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Provision isolated owner, migration, and RLS roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE beaconhs_owner NOLOGIN NOSUPERUSER NOBYPASSRLS;
          CREATE ROLE beaconhs_migrator LOGIN NOINHERIT NOSUPERUSER NOBYPASSRLS PASSWORD 'beaconhs_migrator';
          CREATE ROLE beaconhs_app LOGIN NOINHERIT NOSUPERUSER NOBYPASSRLS PASSWORD 'beaconhs_app';
          CREATE ROLE beaconhs_super LOGIN NOINHERIT NOSUPERUSER BYPASSRLS PASSWORD 'beaconhs_super';
          CREATE ROLE beaconhs_backup LOGIN NOINHERIT NOSUPERUSER BYPASSRLS PASSWORD 'beaconhs_backup';
          ALTER ROLE beaconhs_backup SET default_transaction_read_only = 'on';
          GRANT beaconhs_owner TO beaconhs_migrator;
          ALTER DATABASE beaconhs_test OWNER TO beaconhs_owner;
          REVOKE ALL ON DATABASE beaconhs_test FROM PUBLIC;
          GRANT CONNECT ON DATABASE beaconhs_test TO beaconhs_migrator, beaconhs_app, beaconhs_super, beaconhs_backup;
          \connect beaconhs_test
          ALTER SCHEMA public OWNER TO beaconhs_owner;
          REVOKE ALL ON SCHEMA public FROM PUBLIC;
          SQL
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm deadcode:check
      - name: Test deployment host safeguards
        run: |
          scripts/cluster/dokploy-curl.test.sh
          scripts/ci/require-current-main.test.sh
          scripts/ci/workflow-repository-immutability.test.sh
      - name: Apply the production migration path
        run: pnpm --filter @beaconhs/db exec tsx src/migrate.ts
      - name: Prove migrations are idempotent
        run: pnpm --filter @beaconhs/db exec tsx src/migrate.ts
      - name: Prove Cycas seed transaction, idempotency, and counts
        run: scripts/ci/cycas-demo-seed-integration.sh
      - name: Prove Action property RLS with rollback-only fixtures
        env:
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          pnpm --silent --filter @beaconhs/db run test:action-property-sql |
            psql -h localhost -U postgres -d beaconhs_test -X -v ON_ERROR_STOP=1
      - name: Prove generic property delegation with rollback-only fixtures
        env:
          SUPERADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/beaconhs_test
          UVANOO_PROPERTY_DELEGATION_INTEGRATION: '1'
        run: pnpm --filter @beaconhs/web exec vitest run src/lib/property-delegation.integration.test.ts
      - name: Prove Action property RLS after delegation fixtures
        env:
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          pnpm --silent --filter @beaconhs/db run test:action-property-sql |
            psql -h localhost -U postgres -d beaconhs_test -X -v ON_ERROR_STOP=1
      - name: Prove Hotel Handover RLS with rollback-only fixtures
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d beaconhs_test -X -v ON_ERROR_STOP=1 -f packages/db/src/hospitality-handover-rls.integration.sql
          psql -h localhost -U postgres -d beaconhs_test -X -v ON_ERROR_STOP=1 -f packages/db/src/hospitality-metering-rls.integration.sql
          psql -h localhost -U postgres -d beaconhs_test -X -v ON_ERROR_STOP=1 -f packages/db/src/maintenance-evidence-rls.integration.sql
          psql -h localhost -U postgres -d beaconhs_test -X -v ON_ERROR_STOP=1 -f packages/db/src/incident-property-rls.integration.sql
          psql -h localhost -U postgres -d beaconhs_test -X -v ON_ERROR_STOP=1 -f packages/db/src/inspection-compliance-property-rls.integration.sql
      - run: pnpm test
      - run: pnpm build
  image:
    name: Build staging image
    needs: ci
    if: github.ref == 'refs/heads/feature/uvanoo-phase-1-foundation' || github.ref == 'refs/heads/feature/uvanoo-v1.2'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Require private package before image build
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST: sha256:18d290f5b0c3a026a58f6881326a41dfc4b37f7e939f1ca54f7a8636d5bc18ed
        run: |
          set -euo pipefail
          package_url=https://api.github.com/users/Satho82/packages/container/uvanoo-staging-private
          curl -q -fsS --max-time 30 -H "Authorization: Bearer $GH_TOKEN" "$package_url" \
            | jq -e '.visibility == "private"' >/dev/null
          for url in \
            'https://ghcr.io/token?service=ghcr.io&scope=repository:satho82/uvanoo-staging-private:pull' \
            "https://ghcr.io/v2/satho82/uvanoo-staging-private/manifests/$MANIFEST"; do
            status="$(curl -q -sS --max-time 30 -o /dev/null -w '%{http_code}' "$url")"
            case "$status" in
              401|403) printf 'Anonymous access denied: HTTP %s\n' "$status" ;;
              *) echo "::error::Private-package gate failed: HTTP $status"; exit 1 ;;
            esac
          done
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish staging image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          platforms: linux/amd64
          push: true
          no-cache: true
          pull: true
          tags: ghcr.io/satho82/uvanoo-staging-private:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Satho82/beaconhs
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            DEPLOYMENT_VERSION=${{ github.sha }}
            BUILD_NODE_HEAP_MB=8192
          # Next generates a fresh Server Actions encryption key for this build.
          # Every replica of the release must run this exact immutable digest.
      - name: Verify candidate remains private
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          package_url=https://api.github.com/users/Satho82/packages/container/uvanoo-staging-private
          curl -q -fsS --max-time 30 -H "Authorization: Bearer $GH_TOKEN" "$package_url" \
            | jq -e '.visibility == "private"' >/dev/null
          for url in \
            'https://ghcr.io/token?service=ghcr.io&scope=repository:satho82/uvanoo-staging-private:pull' \
            "https://ghcr.io/v2/satho82/uvanoo-staging-private/manifests/$MANIFEST"; do
            status="$(curl -q -sS --max-time 30 -o /dev/null -w '%{http_code}' "$url")"
            case "$status" in
              401|403) printf 'Anonymous access denied: HTTP %s\n' "$status" ;;
              *) echo "::error::Private-package gate failed: HTTP $status"; exit 1 ;;
            esac
          done
      - name: Record immutable staging image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          printf 'Source: `%s`\n\nImage: `ghcr.io/satho82/uvanoo-staging-private@%s`\n' "$SOURCE_SHA" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
