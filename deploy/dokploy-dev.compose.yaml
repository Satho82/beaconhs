# BeaconHS dev stack for Dokploy.
#
# The GitHub deploy workflow injects all ${VARS} at deploy time. The same image
# runs web, worker, and scheduler roles selected by APP_ROLE.

services:
  web:
    image: ${IMAGE}
    environment:
      APP_ROLE: web
      NODE_ENV: production
      # Next standalone must listen on all interfaces for the reverse proxy.
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      APP_VERSION: ${APP_VERSION}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: dev
      DATABASE_URL: ${DATABASE_URL}
      # Dedicated BYPASSRLS pool for super-admin / cross-tenant access.
      SUPERADMIN_DATABASE_URL: ${SUPERADMIN_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      ATTACHMENT_CAPABILITY_SECRET: ${ATTACHMENT_CAPABILITY_SECRET}
      BETTER_AUTH_URL: ${APP_URL}
      APP_URL: ${APP_URL}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_PRIVATE_BUCKET_CONFIRMED: ${R2_PRIVATE_BUCKET_CONFIRMED}
      # Web serves the public key to the subscribe client and signs the
      # "send test push" action, so it needs the full keypair too.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
    networks: [runtime-db-network, dokploy-network]
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:3000/api/health/ready']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      # The deploy workflow first persists WRITER_REPLICAS=0 as a control-plane
      # fence. A concurrent Dokploy deploy therefore cannot revive old database
      # writers during migration; the final exact-SHA deploy restores this to 1.
      replicas: ${WRITER_REPLICAS}
      restart_policy:
        condition: any
        delay: 5s

  worker:
    image: ${IMAGE}
    environment:
      APP_ROLE: worker
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: dev
      # The worker unseals DB-stored provider secrets (email/SMS/AI keys,
      # connector creds) with the same key web seals them with — without this
      # every sealed transport fails closed instead of using the configured provider.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      # Dedicated cross-tenant DML pool. Migration credentials are never
      # injected into a long-running application container.
      SUPERADMIN_DATABASE_URL: ${SUPERADMIN_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_PRIVATE_BUCKET_CONFIRMED: ${R2_PRIVATE_BUCKET_CONFIRMED}
      APP_URL: ${APP_URL}
      # Keep durable Flow dispatch on the private overlay network.
      INTERNAL_WEB_URL: http://web:3000
      # Worker fans push notifications out to subscribed devices.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
    networks: [runtime-db-network]
    healthcheck:
      test: ['CMD', 'node', 'apps/worker/dist/health.js']
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
    deploy:
      replicas: ${WRITER_REPLICAS}
      restart_policy:
        condition: any
        delay: 5s

  # One-shot storage security bootstrap. It removes anonymous MinIO/S3 bucket
  # policies, installs pending-upload and transient-artifact expiry, and proves
  # anonymous reads fail.
  # Cloudflare R2 additionally requires the explicit private-bucket
  # confirmation after public development/custom domains have been disabled.
  storage-init:
    image: ${IMAGE}
    environment:
      APP_ROLE: storage-init
      NODE_ENV: production
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_PRIVATE_BUCKET_CONFIRMED: ${R2_PRIVATE_BUCKET_CONFIRMED}
    networks: [runtime-db-network]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s

  scheduler:
    image: ${IMAGE}
    environment:
      APP_ROLE: scheduler
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: dev
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    networks: [runtime-db-network]
    deploy:
      replicas: ${WRITER_REPLICAS}
      # One-shot: register BullMQ repeatable jobs, then exit.
      restart_policy:
        condition: on-failure
        delay: 5s


networks:
  runtime-db-network:
    name: ${RUNTIME_DB_NETWORK:?Set RUNTIME_DB_NETWORK}
    external: true
  infra-net:
    external: true
  dokploy-network:
    external: true
